<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 488" width="704" height="488" role="img" aria-labelledby="demo-title demo-desc">
  <!-- T-1016: deterministic animated SVG — do not edit by hand; regenerate with: node scripts/record-demo.mjs -->
  <title id="demo-title">commitlore demo: lifecycle filtering shows only active decisions</title>
  <desc id="demo-desc">A terminal recording. Two decisions are recorded for one path and the later supersedes the first. When an agent proposes reverting to the superseded approach, only the active record is returned.</desc>
  <rect width="100%" height="100%" rx="8" fill="#1d1f21"/>
  <!-- Title bar -->
  <rect width="100%" height="32" rx="8" fill="#282a2e"/>
  <circle cx="20" cy="16" r="6" fill="#cc6666"/>
  <circle cx="38" cy="16" r="6" fill="#f0c674"/>
  <circle cx="56" cy="16" r="6" fill="#b5bd68"/>
  <text x="352" y="20" text-anchor="middle" fill="#969896" font-family="monospace" font-size="12">commitlore demo</text>
  <style>
    text { font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 13px; }
  </style>
  <g id="frame-0" visibility="visible">
    <text x="16" y="62" fill="#81a2be" id="frame-0-line0">$ commitlore demo</text>
    <set attributeName="visibility" to="visible" begin="0.00s" dur="1.83s" fill="remove"/>
    <set attributeName="visibility" to="hidden" begin="1.83s" fill="remove"/>
  </g>
  <g id="frame-1" visibility="hidden">
    <text x="16" y="62" fill="#81a2be" id="frame-1-line0">$ commitlore demo</text>
    <text x="16" y="98" fill="#b5bd68" id="frame-1-line2">─── commitlore demo ───</text>
    <text x="16" y="134" fill="#c5c8c6" id="frame-1-line4">Scenario: two decisions recorded for src/pricing.ts</text>
    <text x="16" y="152" fill="#b294bb" id="frame-1-line5">  1. &quot;Reuse calculatePrice for admin quotes&quot; (later superseded)</text>
    <text x="16" y="170" fill="#c5c8c6" id="frame-1-line6">  2. &quot;Give admin quotes their own path&quot; (supersedes the first — now active)</text>
    <text x="16" y="206" fill="#c5c8c6" id="frame-1-line8">An agent proposes reusing calculatePrice for admin quotes. CommitLore answers:</text>
    <set attributeName="visibility" to="visible" begin="1.83s" dur="1.83s" fill="remove"/>
    <set attributeName="visibility" to="hidden" begin="3.66s" fill="remove"/>
  </g>
  <g id="frame-2" visibility="hidden">
    <text x="16" y="62" fill="#81a2be" id="frame-2-line0">$ commitlore demo</text>
    <text x="16" y="98" fill="#b5bd68" id="frame-2-line2">─── commitlore demo ───</text>
    <text x="16" y="134" fill="#c5c8c6" id="frame-2-line4">Scenario: two decisions recorded for src/pricing.ts</text>
    <text x="16" y="152" fill="#b294bb" id="frame-2-line5">  1. &quot;Reuse calculatePrice for admin quotes&quot; (later superseded)</text>
    <text x="16" y="170" fill="#c5c8c6" id="frame-2-line6">  2. &quot;Give admin quotes their own path&quot; (supersedes the first — now active)</text>
    <text x="16" y="206" fill="#c5c8c6" id="frame-2-line8">An agent proposes reusing calculatePrice for admin quotes. CommitLore answers:</text>
    <text x="16" y="242" fill="#b5bd68" id="frame-2-line10">  Record-Id: r-price02 [active]</text>
    <text x="16" y="260" fill="#cc6666" id="frame-2-line11">    Limit: calculatePrice owns final checkout pricing only</text>
    <text x="16" y="278" fill="#cc6666" id="frame-2-line12">    Ruled-out: reuse checkout pricing | admin eligibility and rounding differ</text>
    <text x="16" y="314" fill="#c5c8c6" id="frame-2-line14">Only the active decision (r-price02) is shown.</text>
    <text x="16" y="332" fill="#b294bb" id="frame-2-line15">The superseded reuse decision is filtered out — the agent cannot revive it.</text>
    <set attributeName="visibility" to="visible" begin="3.67s" fill="freeze"/>
  </g>
</svg>
