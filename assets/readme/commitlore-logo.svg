<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10.5 720 114.8" width="720" height="115"
     role="img" aria-labelledby="commitlore-logo-title commitlore-logo-desc">
  <title id="commitlore-logo-title">CommitLore</title>
  <desc id="commitlore-logo-desc">CommitLore logo showing an active decision path continuing forward while a superseded branch remains in history.</desc>
  <!-- Wordmark: IBM Plex Sans SemiBold (SIL OFL 1.1), set at cap height 48
       with 0.05em tracking and converted to outlines with fontTools, so the
       file loads no font and depends on nothing at render time. -->

  <style>
    /* Motion states the model: the in-force path keeps advancing, the
       superseded branch is drawn once and never moves again. */
    @keyframes cl-flow  { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -54 } }
    @keyframes cl-alive { 0%, 100% { transform: scale(1);    opacity: .88 }
                          50%      { transform: scale(1.07); opacity: 1 } }

    .cl-flow  { animation: cl-flow 2.8s linear infinite }
    .cl-alive { animation: cl-alive 2.6s ease-in-out infinite;
                transform-box: fill-box; transform-origin: center; opacity: 1 }

    @media (prefers-reduced-motion: reduce) {
      .cl-flow  { animation: none !important; opacity: 0 }
      .cl-alive { animation: none !important; opacity: 1 }
    }
  </style>

  <!-- The symbol's mass hangs below its rail, so the group is lifted until the
       whole mark centres on the wordmark rather than the rail centring on it. -->
  <g transform="translate(0 -11)">
  <g fill="none" stroke-linecap="round">
    <!-- history that remains: the rail already committed -->
    <path d="M 30 46 H 122" stroke="#7D8590" stroke-width="7"/>
    <!-- superseded: diverges, stops short, keeps its place in history -->
    <path d="M 76 46 L 100 70" stroke="#7D8590" stroke-width="5.5"
          stroke-dasharray="7 7" opacity=".8"/>
    <circle cx="108" cy="78" r="8.5" stroke="#7D8590" stroke-width="5.5" opacity=".8"/>
    <!-- still in force: the only path that continues -->
    <path d="M 122 46 H 176" stroke="#2EA043" stroke-width="8"/>
    <path class="cl-flow" d="M 122 46 H 176" stroke="#3FB950" stroke-width="8.5"
          stroke-dasharray="17 37"/>
    <circle cx="176" cy="46" r="19" stroke="#3FB950" stroke-width="2" opacity=".4"/>
  </g>

  <g fill="#7D8590">
    <circle cx="30" cy="46" r="7.5"/>
    <circle cx="76" cy="46" r="7.5"/>
    <circle cx="122" cy="46" r="7.5"/>
  </g>
  <circle class="cl-alive" cx="176" cy="46" r="12" fill="#3FB950"/>
  </g>

