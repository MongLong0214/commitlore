<svg
  xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="360"
  viewBox="0 0 720 360"
  role="img"
  aria-labelledby="commitlore-hero-title commitlore-hero-desc"
>
  <title id="commitlore-hero-title">Only decisions still in force reach the next edit</title>
  <desc id="commitlore-hero-desc">For src/pricing.ts, Git history holds two decisions. The active one carries its limit and the alternative it ruled out into the context delivered before the next edit. An earlier decision that also covered admin quotes has been superseded and stays in history without moving forward as current guidance.</desc>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label   { font-size: 24px; font-weight: 700; letter-spacing: 0.6px; fill: #8B949E; }
    .state   { font-size: 24px; font-weight: 700; letter-spacing: 0.6px; }
    .body    { font-size: 24px; font-weight: 500; fill: #F0F6FC; }
    .keyname { font-size: 24px; font-weight: 700; fill: #8B949E; }
    .value   { font-size: 24px; font-weight: 600; fill: #F0F6FC; }
    .foot    { font-size: 24px; font-weight: 600; fill: #8B949E; }
  </style>

  <rect width="720" height="360" fill="#0D1117"/>

  <text class="mono label" x="28" y="42">src/pricing.ts</text>

  <text class="sans label" x="28" y="86">GIT HISTORY</text>
  <text class="sans label" x="396" y="86">BEFORE NEXT EDIT</text>

  <circle cx="38" cy="124" r="8" fill="#3FB950"/>
  <text class="sans state" x="58" y="132" fill="#3FB950">ACTIVE</text>
  <text class="sans body" x="58" y="164">Checkout pricing only</text>

  <path d="M196 126 H360" stroke="#3FB950" stroke-width="3" stroke-linecap="round"/>
  <path d="M352 119 L362 126 L352 133 Z" fill="#3FB950"/>

  <circle cx="38" cy="228" r="8" fill="none" stroke="#8B949E" stroke-width="3"/>
  <text class="sans state" x="58" y="236" fill="#8B949E">SUPERSEDED</text>
  <text class="sans body" x="58" y="268" fill="#8B949E">Also served admin quotes</text>

  <path d="M228 230 H300" stroke="#8B949E" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
  <path d="M312 220 L332 240 M332 220 L312 240" stroke="#8B949E" stroke-width="4" stroke-linecap="round"/>

  <rect x="396" y="102" width="296" height="176" rx="8" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  <text class="sans keyname" x="420" y="140">Limit</text>
  <text class="sans value"   x="420" y="172">Checkout pricing only</text>
  <text class="sans keyname" x="420" y="216">Ruled out</text>
  <text class="sans value"   x="420" y="248">Admin quote reuse</text>

  <text class="sans foot" x="28" y="330">Only decisions still in force move forward.</text>
</svg>
