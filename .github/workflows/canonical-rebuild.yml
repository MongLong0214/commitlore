name: Canonical rebuild

# T-1501 (#719). `dist/` is committed because a git clone is the install
# (ADR-0011), so every commit on `main` has to match the bundle its own source
# produces. Today a contributor carries that by hand, and `build:canonical` is a
# `linux/amd64` Docker build — which is why #720 arrived from a Windows machine
# with `src/` and `test/` only, correctly, and waited on a maintainer twice.
#
# This closes that gap without moving any existing check. When a push to `main`
# leaves the committed bundle behind its source, the App opens a pull request
# carrying the rebuild. Every required context runs on it and it merges like
# anything else.
#
# It does not push to `main`. ADR-0036: `main` requires eleven contexts and the
# eleventh is `lint`, which no push can produce — `demo-lint.yml`'s push trigger
# is scoped to `dev` and its `lint` job is additionally gated on
# `github.event_name == 'pull_request'`. So a push-shaped design needs a bypass,
# and a bypass is not "the check passed"; it is "the check did not have to".
# Measured 2026-08-18: an App-opened pull request attaches all eleven
# (run 32082467906).
on:
  push:
    branches: [main]

# The App does everything with its own token. This is only to read the push.
permissions:
  contents: read

# One at a time. Two pushes close together would each compute a rebuild of a
# tree the other invalidated, and the second would open a pull request against
# a `main` that had already moved.
concurrency:
  group: canonical-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Without this the checkout leaves an `http.<url>.extraheader` holding
          # the Actions token, and that header beats credentials in a push URL —
          # the App would be carrying a valid token and pushing as somebody else.
          # Measured on this repository before #741 fixed the same line.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - run: npm ci

      # The loop this has to not enter. A rebuild pull request touches exactly
      # these two paths, so its own merge would otherwise ask for another
      # rebuild of a tree that is already correct.
      - name: Stop if this push is itself a rebuild
        id: guard
        run: |
          set -euo pipefail
          changed="$(git show --name-only --format= HEAD | sed '/^$/d' | sort -u)"
          if [ -z "$changed" ]; then
            # No paths at all. That is not "only artifacts" -- it is no evidence,
            # and reading it as a skip would silently pass over a push that does
            # need a rebuild. Fall through and let the build decide.
            echo "--- this commit reports no changed paths; letting the build decide"
            echo "skip=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          only_artifacts=1
          while IFS= read -r path; do
            case "$path" in
              dist/*|installer/canonical-artifact.json) ;;
              *) only_artifacts=0 ;;
            esac
          done <<< "$changed"
          if [ "$only_artifacts" = "1" ]; then
            echo "--- this commit touches only dist/ and the manifest; nothing to do"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and see whether the committed bundle is behind
        id: build
        if: steps.guard.outputs.skip == '0'
        run: |
          set -euo pipefail
          npm run build:canonical
          npm run artifact:manifest
          npm run artifact:verify
          if git diff --quiet -- dist/ installer/canonical-artifact.json; then
            echo "--- the committed bundle already matches its source"
            echo "needed=0" >> "$GITHUB_OUTPUT"
          else
            echo "--- the committed bundle is behind its source:"
            git diff --stat -- dist/ installer/canonical-artifact.json
            echo "needed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint an installation token
        id: token
        if: steps.build.outputs.needed == '1'
        env:
          COMMITLORE_BOT_APP_ID: ${{ secrets.COMMITLORE_BOT_APP_ID }}
          COMMITLORE_BOT_KEY: ${{ secrets.COMMITLORE_BOT_KEY }}
        run: |
          set -euo pipefail
          token="$(node scripts/app-installation-token.mjs)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Open the rebuild as a pull request
        if: steps.build.outputs.needed == '1'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="$(git rev-parse --short "$HEAD_SHA")"
          branch="canonical-rebuild/$short"

          # The bot user id, not the App id. A noreply address carrying the App
          # id matches no account, and the commit is attributed to nobody (#743).
          git config user.name  'commitlore-canonical-build[bot]'
          git config user.email '317873099+commitlore-canonical-build[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add dist/ installer/canonical-artifact.json
          git commit --quiet -m "$(printf 'Rebuild the canonical bundle for %s\n\nThe committed bundle was behind its source after that commit merged, which is what happens when two source pull requests land close together: `.gitattributes` marks `dist/**` as `-diff -merge`, so the second one carries the bundle the first one left behind.\n\nThis is the rebuild, opened as a pull request rather than pushed. Every required context runs on it -- `main` requires eleven and the eleventh is `lint`, which no push to `main` can produce (ADR-0036), so a push-shaped rebuild would need a bypass and a bypass is not the check passing.\n\nLimit: this proves the bundle matches the source of the commit it was built from; whether that commit is the one a reader wants is what the pull request review is for\nBlast: system\nUndo: easy\nCertainty: firm\nRecord-Id: r-rebuild%s\nProvenance: authored\nVerified: `artifact:verify` passed against the regenerated manifest in the same job, and the two `build:canonical` runs in `check` compare this tree to itself on the pull request\nCommitLore-Version: 2.0.0' "$short" "$short")"

          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

          # Who the server says committed it, before anything is opened on top.
          # A push that silently used the wrong identity is the failure this
          # read-back exists to catch, and it caught one (#743).
          pusher="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$(git rev-parse HEAD)" --jq '.committer.login // "unknown"')"
          echo "--- pushed $branch; committer on the server: $pusher"

          gh pr create --base main --head "$branch" \
            --title "Rebuild the canonical bundle for $short" \
            --body "$(printf 'The committed bundle fell behind its source when [`%s`](https://github.com/%s/commit/%s) merged.\n\n`.gitattributes` marks `dist/**` as `-diff -merge`, so two source pull requests landing close together leave the second one carrying the bundle the first one left behind. This is the rebuild.\n\nOpened as a pull request rather than pushed: `main` requires eleven contexts and the eleventh is `lint`, which no push to `main` can produce (ADR-0036). A push-shaped rebuild would need a bypass, and a bypass is not the check passing.\n\nOpened by `canonical-rebuild.yml` for #719.' "$short" "$GITHUB_REPOSITORY" "$HEAD_SHA")"

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.guard.outputs.skip }}" = "1" ]; then
            echo "skipped: the push was itself a rebuild"
          elif [ "${{ steps.build.outputs.needed }}" = "0" ]; then
            echo "nothing to do: the committed bundle matches its source"
          else
            echo "a rebuild pull request was opened"
          fi
