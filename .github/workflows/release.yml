name: Release

# Cutting a release is an owner action, not something CI can decide to do.
# The only trigger is a `v*` tag being pushed — never a schedule, never a
# push to a branch, never `workflow_dispatch`. Pushing the tag *is* the
# approval; this workflow has no separate one to give.
on:
  push:
    tags:
      - "v*"

# Read for the workflow; the ability to create a release belongs to the one job
# that creates one. Granting `contents: write` here hands it to the gates too,
# and the gates run `actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4` and `actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4` — mutable
# major tags whose contents can change under the same reference. Anything
# executing inside a gate with a release-write token could create the release
# before that gate, or any other, had finished, which would make the ordering
# these jobs exist to enforce decorative.
#
# `id-token` and `attestations` were granted for an attestation action this
# workflow does not contain. Privilege granted for a step that is not here is
# privilege available to every step that is.
permissions:
  contents: read
  # `exact-head-ci` reads the check runs GitHub recorded for the tagged commit.
  # Reading a branch's green badge would answer a different, weaker question.
  checks: read

jobs:
  # The canonical commit is fixed ONCE, here, and every later boundary consumes
  # that sha. Each boundary used to resolve the tag *name* again, which meant
  # four gates could each qualify a different commit: a ref-move regression
  # showed the ancestry and CI gates still accepting the original sha while a
  # fresh clone of the same tag landed on another main descendant.
  #
  # The anchor is the event sha, not the live tag. `github.sha` is what the tag
  # pointed at when the push happened and cannot be changed afterwards; the ref
  # can. Resolving the name here would leave a window before this job starts in
  # which a move redefines the whole release, so the tag name is only ever the
  # version label and the key the final binding check looks up.
  release-target:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.ancestry.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - id: ancestry
        name: The pushed commit is already contained in main
        run: node scripts/check-release-target.mjs "$GITHUB_SHA" main --github-output

  # Refuses the whole release before a single binary is built. A release whose
  # asset reports a version that disagrees with its own tag is not fixable
  # after the fact: the asset is immutable once downloaded, and a tag someone
  # has already fetched cannot be corrected for them by moving it here.
  #
  # The tag itself is not immutable — this workflow exists because a ref can
  # move — which is what the `v*` ruleset and the binding check below are for.
  # See scripts/check-release-version.mjs.
  #
  # The checkout takes the canonical sha, not the tag: the version this job
  # compares must come from the same bytes every other gate qualified.
  version-consistency:
    needs: release-target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-target.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tag, package.json, and `commitlore --version` agree
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

  # A tag push does not create a new CI result for the commit it names. The
  # relevant evidence is the existing set of check runs at that exact commit,
  # not the last green run on main and not a local suite this release happens
  # to start. The script has a fixed required list and treats every missing or
  # non-success result as a block; an empty API response is therefore a failure.
  exact-head-ci:
    needs: release-target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-target.outputs.commit }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Every required CI check succeeded at the tagged commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-exact-head-ci.mjs "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}" "${{ needs.release-target.outputs.commit }}"

  # RELEASE-GATE §4 used to be a human checklist run after `gh release create`.
  # That made a failed row a correction to something already published: the
  # release existed, but its documented installation did not work. This job
  # makes the six checks a prerequisite instead, so publication cannot get
  # ahead of the artifact it claims to qualify.
  install-gate:
    needs: release-target
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ needs.release-target.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-target.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      # A checkout can hide exactly the distribution failures this protects
      # against: an untracked bundle, a path that reaches back to the source
      # tree, or dependencies left over from CI. Clone anew and run every check
      # from that clone as an installer does.
      #
      # The clone lands on the canonical sha rather than `--branch <tag>`. That
      # is the difference this correction exists for: cloning by name asks the
      # remote what the tag means *now*, and the answer can differ from the one
      # the other gates were given. `--no-checkout` first, because the sha is
      # not a branch and cannot be a clone target directly.
      - name: The tagged installation passes RELEASE-GATE section 4
        run: |
          set -euo pipefail
          clone_dir="$(mktemp -d)/commitlore"
          git clone --quiet --no-checkout \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$clone_dir"
          git -C "$clone_dir" checkout --quiet --detach "$RELEASE_COMMIT"
          cd "$clone_dir"

          landed="$(git rev-parse HEAD)"
          test "$landed" = "$RELEASE_COMMIT" || {
            echo "clone landed on $landed, expected the qualified commit $RELEASE_COMMIT"
            exit 1
          }
          printf 'fresh clone commit: %s\n' "$landed"

          # The bundle is the shipped CLI; no build or npm install belongs in
          # this job, because either would conceal a clone missing what ships.
          clone_version="$(node dist/commitlore.mjs --version)"
          printf 'fresh clone version: %s\n' "$clone_version"

          if validation_output="$(printf 'Subject\n\nBlast: wide\n' | node dist/commitlore.mjs validate 2>&1)"; then
            echo "expected the invalid message to be rejected"
            exit 1
          else
            validation_exit=$?
          fi
          printf '%s\n' "$validation_output"
          test "$validation_exit" -eq 1 || {
            echo "validate exited $validation_exit, expected 1"
            exit 1
          }
          case "$validation_output" in
            *Blast*) ;;
            *)
              echo "validate rejected the message without reporting its Blast violation"
              exit 1
              ;;
          esac

          # A fresh clone is allowed to warn about unfetched notes and setup it
          # has not opted into. `doctor` exits zero exactly when none of those
          # findings is a fail, which is the RELEASE-GATE row's condition.
          node dist/commitlore.mjs doctor

          # The installed stub records node's absolute path. This command
          # removes node from PATH while retaining git, so a rejection proves
          # the hook used that recorded interpreter rather than ambient PATH.
          git config user.name "Release gate"
          git config user.email "release-gate@example.invalid"
          node dist/commitlore.mjs hooks install
          if hook_output="$(env -i PATH=/usr/bin:/bin git commit --allow-empty \
            -m 'Release gate invalid message' -m 'Blast: wide' 2>&1)"; then
            echo "expected the PATH-less hook to reject the invalid commit"
            exit 1
          else
            hook_exit=$?
          fi
          printf '%s\n' "$hook_output"
          test "$hook_exit" -ne 0 || {
            echo "the PATH-less hook accepted an invalid commit"
            exit 1
          }
          case "$hook_output" in
            *Blast*) ;;
            *)
              echo "the hook rejected the commit without running validation"
              exit 1
              ;;
          esac

          # This is the earlier, marker-bearing stub body. Installing first
          # records an otherwise healthy target; replacing only the body makes
          # a real stale-stub fixture rather than merely testing a missing hook.
          hook_path="$(git rev-parse --git-path hooks/commit-msg)"
          printf '%s\n' '#!/bin/sh' '# commitlore:commit-msg:v1' \
            'exec commitlore validate "$1"' > "$hook_path"
          chmod +x "$hook_path"

          # Doctor deliberately runs a hook probe with PATH=/usr/bin:/bin.
          # This historical body therefore also produces the expected separate
          # hook-runtime fail and doctor exits 1. The row being qualified is
          # commit-msg-hook, whose required verdict is warn rather than ok, so
          # read that row instead of mistaking the fixture's other finding for
          # this row's outcome.
          if stale_report="$(node dist/commitlore.mjs doctor --json)"; then
            stale_doctor_exit=0
          else
            stale_doctor_exit=$?
          fi
          printf '%s\n' "$stale_report"
          printf 'stale-hook doctor exit: %s\n' "$stale_doctor_exit"
          printf '%s' "$stale_report" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const report = JSON.parse(input);
              const hook = report.checks.find((check) => check.id === "commit-msg-hook");
              if (hook?.status !== "warn") {
                console.error("expected the stale commit-msg hook to warn, got:", hook);
                process.exit(1);
              }
              console.log("stale commit-msg hook: warn");
            });
          '

          # The runner intentionally prefers a CLI on PATH, so keep PATH narrow
          # and include only the node directory needed for the clone fallback.
          # Comparing versions catches a different installation that still
          # answers --version successfully (#483).
          node_dir="$(dirname "$(command -v node)")"
          plugin_version="$(env PATH="/usr/bin:/bin:$node_dir" \
            CLAUDE_PLUGIN_ROOT="$clone_dir" "$clone_dir/scripts/commitlore-run.sh" --version)"
          printf 'plugin version: %s\n' "$plugin_version"
          test "$plugin_version" = "$clone_version" || {
            echo "plugin resolved $plugin_version, expected clone version $clone_version"
            exit 1
          }

  # Nothing is compiled and nothing is attached. ADR-0026 makes the plugin the
  # canonical install path and `install.sh`/`install.ps1` the secondary one, and
  # both take a pinned source checkout -- so the release itself is the tag, and the
  # tag is what those installers resolve. A release with no assets is the whole
  # artifact set, not an incomplete one.
  publish:
    # A skipped or failed prerequisite skips this job by GitHub's default needs
    # semantics. Keep it free of `if:`: a condition such as `always()` would
    # turn a failed qualification into a path that can still publish.
    needs: [version-consistency, install-gate, release-target, exact-head-ci]
    # The only job that may create a release, and it cannot start until all four
    # gates have passed. Scoping the grant here is what makes that ordering a
    # constraint rather than a convention.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ needs.release-target.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-target.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      # Everything above can pass and the tag can still move before this step.
      # The repository's `v*` ruleset (update and deletion both denied) is the
      # standing control; this is the check that does not assume it held. It
      # asks the remote, because a checkout only records what the tag meant
      # when it was taken.
      - name: The live tag still resolves to the qualified commit
        run: node scripts/check-tag-binding.mjs "$GITHUB_REF_NAME" "$RELEASE_COMMIT"

      # `--verify-tag` refuses when the tag does not exist, so publication can
      # never create the reference it was meant to verify.
      #
      # `--target` is NOT what binds the release, and nothing here relies on it.
      # It is documented as the branch or sha used when the command creates a
      # tag automatically; what the CLI does with it when the tag already
      # exists is not something this workflow asserts either way. The proven
      # property is the narrow one: it does not establish that the tag equals
      # this commit and it cannot retarget an existing tag.
      #
      # It is passed as explicit request metadata, and as defence for one
      # future mistake: if an edit drops `--verify-tag`, the implicit creation
      # that re-enables lands on the qualified commit instead of the default
      # branch. What binds the release is the step above proving the live tag
      # resolves to this commit, and the no-bypass `v*` ruleset keeping it there.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$RELEASE_COMMIT" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
