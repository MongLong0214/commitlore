name: CI

on:
  push:
    branches: [main, dev, 'release-*', 'hotfix-*']
  pull_request:

# The conformance suite and the dogfooding gate are the two things that make
# this repository's claims checkable. Neither is optional, and neither is
# allowed to pass by being skipped.
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor this package promises (`engines.node`) and the current
        # Active LTS. Running only the floor misses breakage on newer runtimes;
        # running only the newest makes the floor a claim nobody checks.
        #
        # The floor is pinned exactly. `22` asks setup-node for the newest 22.x
        # — 22.23 at the time of writing — so the declared floor of 22.12.0 was
        # never the version any job executed. The installers refuse 22.11 and
        # accept 22.12 in `test/install-script.test.ts`, but nothing ran on it.
        node: ['22.12.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # test/dogfood.test.ts validates this repository's own commit history.
          # A shallow clone would truncate it, and the suite is written to fail
          # loudly rather than silently check nothing -- but there is no reason
          # to make it do that on every run.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # npm reports EBADENGINE as a warning and installs anyway, so a dependency
      # that breaks the supported floor lands silently and surfaces later as
      # something unrelated -- here, as test workers dying with no explanation.
      - name: Dependencies support the supported Node floor
        run: node scripts/check-engines.mjs

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck bench
        run: npx tsc -p bench/tsconfig.json --noEmit

      - name: Build
        run: npm run build

      # dist/ is committed because that is what makes this repository
      # installable as a plugin with no registry (ADR-0011). A committed build
      # that drifts from src/ ships stale code to every user, and the drift is
      # invisible -- nothing fails, the wrong thing just runs. The build is
      # deterministic, so rebuilding and diffing is a complete check.
      - name: Committed dist/ matches src/
        run: |
          git diff --exit-code -- dist/ || {
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            exit 1
          }

      - name: Unit and dogfooding tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json

      # A worker that dies removes its file from the report without failing the
      # run, so a green summary can be hiding an untested module. Compare the
      # files on disk to the files in the report.
      - name: Every test file actually ran
        run: node scripts/check-test-files-ran.mjs vitest-report.json

      # Fixture conformance, README example sync, and the README vocabulary
      # table vs SPEC section 3. Documentation claims that can be checked by
      # machine are checked by machine.
      - name: Conformance suite
        run: bash spec/verify.sh

      # PRD-F2 AC 2 claims a path-scoped query stays under 100ms on a
      # 100k-commit repository. The default suite runs this file against 2k
      # commits, so without this step the acceptance criterion is asserted and
      # never measured. Measured locally at p50 1.86ms -- 54x under the
      # threshold -- so a CI runner would have to be fifty times slower before
      # this went marginal, which is what makes it safe to gate on rather than
      # merely report.
      - name: PRD-F2 100k-commit query performance
        env:
          COMMITLORE_PERF_LARGE: "1"
        run: npx vitest run test/index-perf.test.ts --reporter=basic

      # #392: bench/verify.mjs existed for weeks with no npm script and no step
      # here, so the result schema drifted five fields behind the runner and a
      # committed matrix sat in the tree failing the gate for two days. It runs
      # before the README check on purpose -- that step regenerates published
      # figures out of these same rows, and there is no point trusting a number
      # derived from a row whose shape was never checked.
      #
      # No file list: the gate reads bench/results/*.jsonl and decides scope
      # from the rows. Its own header states the two exemptions and why; the
      # step output names them per file on every run.
      - name: Benchmark rows match the result schema
        run: npm run bench:verify

      # Every measured figure in the README is regenerated from bench/results/
      # through bench/report.ts and compared byte for byte, and a short list of
      # statistics is refused outside the generated block. A rate somebody typed,
      # or one generated honestly and then left behind when the matrix grew,
      # fails here. This ran without --write on purpose: CI checks, it never
      # rewrites, so a branch that skipped the regeneration still fails.
      - name: README measured numbers are regenerable
        run: node scripts/check-readme-numbers.mjs

      # test/dogfood.test.ts exercises the library. This exercises the binary a
      # user actually installs, against this repository's own history, which is
      # the only way the packaged entry point, its schema lookup from dist/, and
      # the range walk get covered together.
      #
      # The range is derived rather than pinned -- a hardcoded cutoff goes stale
      # and a stale cutoff reads as passing, which is the same rule the library
      # path follows.
      # The notes mirror is a second authoritative source, and `git fetch` does
      # not carry it. Without it `validate` answers `reference: not-checked` and
      # still exits 0, so the gate that proves this repository keeps its own
      # protocol was passing with half the check skipped (#542). Fetch it, then
      # read the JSON rather than the exit code.
      - name: Fetch the notes mirror so references can be checked
        run: git fetch --no-tags origin '+refs/notes/commitlore:refs/notes/commitlore' || true

      - name: The CLI validates this repository's own history
        run: |
          set -euo pipefail
          node dist/cli.js validate --range "$(node scripts/adoption-range.mjs)" --json > validate.json || true
          node scripts/assert-dogfood.mjs validate.json

      - name: doctor runs clean enough to report
        run: node dist/cli.js doctor

      # Test what is actually shipped. Distribution is a git clone (ADR-0011),
      # so the failure this has to catch is a clone that does not run: dist/
      # missing a file, a path resolved against the source tree rather than the
      # install, or a plugin entry point that is not executable. Cloning into a
      # different directory is the whole test — if it works there, it works for
      # a user.
      - name: A fresh clone runs, and the plugin entry points resolve
        run: |
          set -euo pipefail
          clone_dir="$(mktemp -d)/commitlore"
          git clone --quiet --depth 1 "file://$PWD" "$clone_dir"
          test -f "$clone_dir/dist/commitlore.mjs" || { echo "the bundle is not in the clone"; exit 1; }
          # No node_modules anywhere near it: the bundle carries its dependencies,
          # which is the whole claim ADR-0011 makes and #38 closed.
          test ! -d "$clone_dir/node_modules" || { echo "clone is contaminated with node_modules"; exit 1; }
          node "$clone_dir/dist/commitlore.mjs" --version
          # Reads spec/schema/record.schema.json through the package root walk in
          # core/paths.ts, so this fails if the clone stops carrying spec/ or if
          # a bundled module goes back to guessing its own depth.
          printf 'Subject\n\nBlast: wide\n' | node "$clone_dir/dist/commitlore.mjs" validate && {
            echo "expected a violation to exit non-zero"; exit 1;
          } || test $? -eq 1
          node "$clone_dir/dist/commitlore.mjs" doctor
          # #64: `doctor` recommends this exact command as its fix for a
          # missing index, so it must actually work with no node_modules —
          # this is what a `better-sqlite3` dependency broke silently, because
          # nothing above this line ever built the index in a clean clone.
          node "$clone_dir/dist/commitlore.mjs" index --rebuild
          # And the query commands must actually use what was just built, not
          # silently fall back to scanning git (ADR-0012). `index --json`
          # rather than `context --json`: this clone's default `origin`
          # refspec does not cover `refs/notes/commitlore`, so `context`
          # correctly exits 3 for "notes unfetched" here regardless of the
          # index, which is not what this step checks.
          node "$clone_dir/dist/commitlore.mjs" index --json | node -e '
            let s = "";
            process.stdin.on("data", (d) => { s += d; });
            process.stdin.on("end", () => {
              const out = JSON.parse(s);
              if (out.index?.lastIndexedSha == null || out.rebuilt !== false) {
                console.error("index --json did not report a current, already-built index:", out);
                process.exit(1);
              }
            });
          '
          # The plugin resolves its entry point through this script, with
          # CLAUDE_PLUGIN_ROOT pointing at the clone.
          test -x "$clone_dir/scripts/commitlore-run.sh" || { echo "run script not executable"; exit 1; }
          CLAUDE_PLUGIN_ROOT="$clone_dir" "$clone_dir/scripts/commitlore-run.sh" --version
          # Every plugin manifest must parse, or the plugin silently does nothing.
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json hooks/hooks.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$clone_dir/$f"
          done

  # `npm audit` reported ten vulnerabilities on every run, green every time, and
  # nobody could tell "assessed and accepted" from "never looked at" (#545). The
  # two questions were sharing one number. They are separated here.
  #
  # What users receive is `dist/`, which is committed (ADR-0011) and which the
  # installer clones without ever running npm — an installed CommitLore has no
  # `node_modules` at all. So the vulnerabilities that can reach a user are the
  # ones in the production tree, and that count must be zero. The rest live in
  # the build and test tooling, which runs here and on maintainer machines. They
  # are worth updating, which is what Dependabot is for; they are not worth
  # failing a build that no user's installation depends on.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `--audit-level=low` so that "zero" means zero and not "nothing above the
      # threshold I chose". This is the blocking half.
      - name: Nothing reachable by an installed CommitLore is vulnerable
        run: npm audit --omit=dev --audit-level=low

      # The build tooling, reported rather than enforced. `|| true` is
      # deliberate and is the whole point of the split: this number is
      # information, and the line above is the gate.
      - name: Development-only surface, for the record
        run: npm audit || true

      # The claim above — that an installation has no node_modules — is what
      # makes the split legitimate. If `dist/` ever stops being self-contained,
      # the production audit stops covering what users run, and this fails
      # before that can go unnoticed.
      - name: The shipped runtime resolves with no dependencies installed
        run: |
          set -euo pipefail
          ship="$(mktemp -d)"
          cp -R dist spec package.json "$ship/"
          test ! -e "$ship/node_modules"
          ( cd "$ship" && node dist/commitlore.mjs --version )

  # git's own behavior is the substrate this protocol delegates to, so a git
  # version that parses trailers differently is a correctness problem, not a
  # compatibility footnote. SPEC section 2.1 was derived empirically from one
  # build; this job is where that assumption gets tested against others.
  git-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report git version
        run: git --version
      - name: Conformance suite
        run: bash spec/verify.sh

  # #99: install.sh (the README's second, non-canonical install path — curl the
  # script, pipe it to sh) had never run on a machine that was not the
  # author's. `check`'s fresh-clone step and `binary` above both prove
  # something real, but neither touches install.sh at all — they build
  # dist/commitlore.mjs or dist/commitlore directly from this checkout and run
  # it there. install.sh's own job is different: download a release asset,
  # verify its checksum *before* installing anything, and detect which of six
  # coding agents are on the machine — none of that is exercised anywhere
  # else.
  #
  # This runs it inside containers that start with **nothing preinstalled** —
  # no curl/jq/tar/git added ahead of time to make it pass — on two images
  # chosen for what each one actually is, not for convenience:
  #   - debian:stable-slim: glibc, bash present, but neither curl nor wget
  #     ships by default. Whatever install.sh does about that is what a real
  #     "minimal tooling" machine hits.
  #   - alpine:latest: busybox sh, not bash. install.sh's shebang is
  #     `#!/bin/sh`; this is the actual portability test, and #99 found a real
  #     failure here (see the "musl" step below) — that failure is the point
  #     of running this image, not a flake to work around.
  #
  # ubuntu-latest is not in this matrix on purpose: `binary` above already
  # proves the compiled binary itself works on a real (non-containerized)
  # Linux and macOS host with no Node on PATH. Adding it here would test the
  # same binary a second time through a thicker layer, not a new claim.
  # docs/COMPATIBILITY.md defines "supported" as an install path reaching the
  # host *and the installed result being executed there*. macOS was marked
  # supported on the strength of the conformance suite, with the row itself
  # admitting the install path ran on Linux only — a claim the document's own
  # definition did not support. This job is the missing half.
  install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tag the checkout so install.sh has a pinned version to clone
        run: |
          set -euo pipefail
          version="v$(node -p 'require("./package.json").version')"
          printf 'COMMITLORE_CI_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          git -c user.name=ci -c user.email=ci@example.invalid tag -f "$version"
      - name: Install, then run what was installed
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          export COMMITLORE_INSTALL_SOURCE="$GITHUB_WORKSPACE"

          sh install.sh "$COMMITLORE_CI_VERSION"

          wrapper="$HOME/.local/bin/commitlore"
          test -x "$wrapper"
          test "$("$wrapper" --version)" = "${COMMITLORE_CI_VERSION#v}"

          # Executed, not merely present: a repository is set up and answered.
          repo="$RUNNER_TEMP/repo"
          mkdir -p "$repo/src"
          cd "$repo"
          git init -q .
          git config user.email ci@example.invalid
          git config user.name ci
          printf 'export const run = (x) => x;\n' > src/app.js
          git add -A
          git commit -q --no-verify -m 'feat: initial'
          # `|| true` used to hide that this line passed an option that no
          # longer exists: init never ran, and doctor and context below measured
          # a repository it had never touched while the job stayed green. The
          # exit code alone cannot tell "a step needs attention" (1, which a
          # fixture with no remote always produces) from "could not run", so the
          # evidence is init's own summary line.
          "$wrapper" init --unattended > init.log 2>&1 || true
          cat init.log
          grep -qE '^init: (ready|[0-9]+ step)' init.log
          "$wrapper" doctor >/dev/null
          "$wrapper" context src/app.js >/dev/null

  # The musl row claimed execution on two architectures. Only one of them can
  # run natively here; the other goes through QEMU, which is what makes the
  # claim true rather than smaller.
  install-alpine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - name: Tag the checkout so install.sh has a pinned version to clone
        run: |
          set -euo pipefail
          version="v$(node -p 'require("./package.json").version')"
          printf 'COMMITLORE_CI_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          git -c user.name=ci -c user.email=ci@example.invalid tag -f "$version"
      - name: Install under musl, then run what was installed
        run: |
          set -euo pipefail
          docker run --rm --platform "${{ matrix.platform }}" \
            -e COMMITLORE_CI_VERSION="$COMMITLORE_CI_VERSION" \
            -v "$PWD:/w" -w /w alpine:3.21 sh -c '
              set -eu
              apk add --no-cache nodejs git >/dev/null
              # `--system`, not `--global`: the checkout is owned by the runner
              # uid and this container runs as root with a different HOME, so a
              # global entry is written where git will not read it back.
              # Quoted with double quotes: this whole script is inside single
              # quotes for the outer shell, so a nested single-quoted '*' closes
              # it and git receives one argument instead of two.
              git config --system --add safe.directory /w
              git config --system --add safe.directory "*"
              node --version
              COMMITLORE_INSTALL_SOURCE=/w sh install.sh "$COMMITLORE_CI_VERSION"
              wrapper="$HOME/.local/bin/commitlore"
              test "$("$wrapper" --version)" = "${COMMITLORE_CI_VERSION#v}"
              mkdir -p /tmp/repo/src && cd /tmp/repo
              git init -q .
              git config user.email ci@example.invalid
              git config user.name ci
              printf "export const run = (x) => x;\n" > src/app.js
              git add -A
              git commit -q --no-verify -m "feat: initial"
              "$wrapper" init --unattended > /tmp/init.log 2>&1 || true
              cat /tmp/init.log
              grep -qE "^init: (ready|[0-9]+ step)" /tmp/init.log
              "$wrapper" doctor >/dev/null
              "$wrapper" context src/app.js >/dev/null
            '

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # install.sh no longer downloads a release asset (ADR-0026), so there is
      # no staged tarball, no checksum file and no corrupted copy to reject. What
      # it does instead is clone a pinned tag and write a thin wrapper, so the
      # source under test is a local repository with a tag on it. Nothing here
      # reaches github.com, and nothing here builds a binary.
      # The checkout itself is the source. An earlier revision cloned it to a
      # separate directory and bind-mounted that read-only into the containers,
      # which made git report only "correct access rights and the repository
      # exists" -- a mount and ownership problem standing in for the thing under
      # test. One repository, mounted read-write where the container already
      # mounts it, removes that whole class of noise.
      - name: Tag the checkout so install.sh has a pinned version to clone
        run: |
          set -euo pipefail
          version="v$(node -p 'require("./package.json").version')"
          printf 'COMMITLORE_CI_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          git -c user.name=ci -c user.email=ci@example.invalid tag -f "$version"
          git tag --list "$version"

      - name: Fresh install, then upgrade over it
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          export COMMITLORE_INSTALL_SOURCE="$GITHUB_WORKSPACE"

          sh install.sh "$COMMITLORE_CI_VERSION"
          wrapper="$HOME/.local/bin/commitlore"
          test -x "$wrapper"
          grep -qF '# commitlore:wrapper:v1' "$wrapper"
          test -f "$HOME/.local/share/commitlore/$COMMITLORE_CI_VERSION/dist/commitlore.mjs"
          installed_version="$("$wrapper" --version)"
          test "$installed_version" = "${COMMITLORE_CI_VERSION#v}"

          # The wrapper is replaced by rename, and a second run is an upgrade
          # rather than a refusal. An in-place overwrite of a file that may be
          # executing is the defect that forced a same-day patch release.
          sh install.sh "$COMMITLORE_CI_VERSION"
          test "$("$wrapper" --version)" = "${COMMITLORE_CI_VERSION#v}"

          # No shell profile is written. Printing the PATH line is the whole of
          # what this script does about PATH.
          for rc in .bashrc .zshrc .profile .bash_profile; do
            test ! -e "$HOME/$rc" || { echo "::error::install.sh wrote $rc"; exit 1; }
          done

      - name: The script carries no asset, checksum or target triple
        run: |
          set -euo pipefail
          for forbidden in SHA256SUMS '.tar.gz' 'tar -xzf' unknown-linux-gnu apple-darwin; do
            if grep -qF "$forbidden" install.sh; then
              echo "::error::install.sh still mentions $forbidden"
              exit 1
            fi
          done

      # A bare image is the point: the prerequisites are genuinely absent, so
      # the named failure is the thing being asserted rather than routed around.
      # Adding them afterwards is the same progression the previous version of
      # this job used for curl -- assert the clean failure first, then the
      # success once the requirement is satisfied.
      - name: Bare debian names the missing prerequisite and installs nothing
        run: |
          set -euo pipefail
          docker run --rm -e COMMITLORE_CI_VERSION="$COMMITLORE_CI_VERSION" -v "$PWD:/w" -w /w debian:stable-slim sh -c '
            set -eu
            out=$(COMMITLORE_INSTALL_SOURCE=/w sh install.sh "$COMMITLORE_CI_VERSION" 2>&1 || true)
            printf "%s\n" "$out"
            printf "%s" "$out" | grep -qi "node" || { echo "expected the message to name Node"; exit 1; }
            test ! -e "$HOME/.local/bin/commitlore" || { echo "something was installed"; exit 1; }
          '

      - name: The same image succeeds once Node and Git are present
        run: |
          set -euo pipefail
          docker run --rm -e COMMITLORE_CI_VERSION="$COMMITLORE_CI_VERSION" -v "$PWD:/w" -w /w node:22-bookworm-slim sh -c '
            set -eu
            apt-get update -qq && apt-get install -y -qq git >/dev/null
            # The checkout is owned by the runner uid, not this container user.
            git config --global --add safe.directory /w
            git config --global --add safe.directory "*"
            # Raw clone first, unfiltered: if the installer cannot fetch, this
            # shows git saying why instead of leaving it to be inferred.
            echo "--- raw clone probe ---"
            git clone --depth 1 --branch "$COMMITLORE_CI_VERSION" /w /tmp/probe || echo "(probe failed, see above)"
            echo "--- installer ---"
            COMMITLORE_INSTALL_SOURCE=/w sh install.sh "$COMMITLORE_CI_VERSION"
            test "$("$HOME/.local/bin/commitlore" --version)" = "${COMMITLORE_CI_VERSION#v}"
          '

  # T-1121 (#282): install.ps1 is install.sh's twin, and a shape test cannot show
  # that a PowerShell script runs. This job is the evidence -- a real
  # windows-latest runner, the script executed the way a user would execute it,
  # and the tool it installs used afterwards.
  #
  # The source is this checkout with a local tag, exactly as the install-script
  # job does for the shell installer: nothing here reaches github.com, so the job
  # tests the script rather than the network.
  #
  # Both hosts are exercised, and each one does real work rather than repeating
  # the other: Windows PowerShell 5.1 performs the first install, PowerShell 7
  # performs the upgrade. 5.1 matters because it is what a Windows machine has
  # before anyone installs anything, and a 7-only construct fails to parse the
  # whole file rather than one branch of it.
  #
  # The hosts are named literally. `shell:` accepts no expression -- a
  # `${{ matrix.shell }}` there makes the workflow unloadable, which is how this
  # job was first written and how it first failed (actions/runner#444).
  install-ps1:
    runs-on: windows-latest
    # A hook that hangs rather than refusing is one of the outcomes this job now
    # measures, and every commit it makes is individually bounded. This is the
    # backstop for the case a bound is ever missed: without it the job runs to
    # the runner's six-hour default and prints nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Tag this checkout so the installer has a pinned source
        shell: bash
        run: |
          set -euo pipefail
          git config user.email t@example.com
          git config user.name "CommitLore CI"
          version="v$(node -p 'require("./package.json").version')"
          wrong_version='v0.0.1'
          if [ "$wrong_version" = "$version" ]; then wrong_version='v0.0.2'; fi
          printf 'COMMITLORE_CI_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'COMMITLORE_CI_WRONG_VERSION=%s\n' "$wrong_version" >> "$GITHUB_ENV"
          git tag -f "$version"
          # The wrong tag must name a different *commit*, not just a different
          # name for this one. Tagging both at HEAD made the mislabelled clone
          # contain the requested tag at its own HEAD, so binding passed and the
          # step proved nothing. Reusing HEAD's tree keeps the checkout
          # internally valid -- the manifest and smoke test still pass -- so the
          # only thing left to reject it is the version binding under test.
          wrong_commit="$(git commit-tree 'HEAD^{tree}' -p HEAD -m 'ci: a clean tree that is not the requested release')"
          git tag -f "$wrong_version" "$wrong_commit"

      # -File, under 5.1, with the version as a positional argument: the same
      # entry point a user gets from `& ([scriptblock]::Create((irm ...))) <tag>`,
      # and the one that proves param() binds.
      - name: Install under Windows PowerShell 5.1
        shell: cmd
        env:
          COMMITLORE_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 %COMMITLORE_CI_VERSION%
          if errorlevel 1 exit /b 1

      - name: The 5.1 host reports its own version, for the record
        shell: cmd
        run: powershell.exe -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: The shim exists, is CRLF, and reports the declared version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shim = Join-Path $env:LOCALAPPDATA 'commitlore\bin\commitlore.cmd'
          if (-not (Test-Path -LiteralPath $shim)) { throw "no shim at $shim" }
          $body = Get-Content -LiteralPath $shim -Raw
          if ($body -notmatch 'commitlore:wrapper:v1') { throw 'the shim carries no marker' }
          if ($body -notmatch "`r`n") { throw 'the shim is not CRLF' }
          $version = (& $shim --version | Select-Object -First 1)
          Write-Host "shim reports: $version"
          $declared = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version.Trim() -ne $declared) { throw "shim reports $version, package.json declares $declared" }
          & $shim --help > $null
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

      # The documented piped form, under PowerShell 7. `iex` gives a piped script
      # no arguments, so the version arrives through COMMITLORE_VERSION -- which is
      # why that variable exists. This step is also the only check that a leading
      # param() block survives Invoke-Expression at all.
      - name: A second install through the documented pipe is an upgrade
        shell: pwsh
        env:
          COMMITLORE_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:COMMITLORE_VERSION = $env:COMMITLORE_CI_VERSION
          $out = (Get-Content -LiteralPath .\install.ps1 -Raw | Invoke-Expression 2>&1 | Out-String)
          Write-Host $out
          if ($out -notmatch 'reusing the existing checkout') { throw 'the checkout was not reused' }
          if ($out -notmatch 'upgrading the existing commitlore shim') { throw 'the shim was not recognized as its own' }

      # A clean checkout can be internally valid and still be the wrong release.
      # This is Windows evidence for the same version-binding condition the shell
      # installer exercises locally: a directory named for the requested tag does
      # not authorize activation until its own tag agrees.
      - name: A clean wrong tag at the requested checkout path is refused
        shell: cmd
        env:
          COMMITLORE_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          set "root=%TEMP%\commitlore-version-binding"
          rmdir /s /q "%root%" 2>nul
          mkdir "%root%\commitlore"
          set "LOCALAPPDATA=%root%"
          set "COMMITLORE_INSTALL_DIR=%root%\bin"
          git clone --quiet --depth 1 --branch %COMMITLORE_CI_WRONG_VERSION% "%GITHUB_WORKSPACE%" "%root%\commitlore\%COMMITLORE_CI_VERSION%" > "%root%-clone.log" 2>&1
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 %COMMITLORE_CI_VERSION% > "%root%-wrong-tag.log" 2>&1
          set "code=%ERRORLEVEL%"
          type "%root%-wrong-tag.log"
          if not "%code%"=="3" (
            echo ::error::expected exit 3 for a clean wrong-tag checkout, got %code%
            exit /b 1
          )
          findstr /C:"requested tag %COMMITLORE_CI_VERSION%" "%root%-wrong-tag.log" >nul || (
            echo ::error::the requested-tag mismatch was not named
            exit /b 1
          )
          if exist "%root%\bin\commitlore.cmd" (
            echo ::error::a shim was activated for the wrong tag
            exit /b 1
          )

      # This has to run on Windows rather than be inferred from the shape test:
      # cmd.exe is the active wrapper, and the transaction is only established
      # when its unchanged bytes survive both damaged-checkout attempts.
      - name: Damaged installed bundles are refused without replacing the Windows shim
        shell: cmd
        env:
          COMMITLORE_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          set "root=%TEMP%\commitlore-installer-transaction"
          rmdir /s /q "%root%" 2>nul
          set "LOCALAPPDATA=%root%"
          set "COMMITLORE_INSTALL_DIR=%root%\bin"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 %COMMITLORE_CI_VERSION% > "%root%-initial.log" 2>&1
          if errorlevel 1 exit /b 1
          set "shim=%root%\bin\commitlore.cmd"
          set "bundle=%root%\commitlore\%COMMITLORE_CI_VERSION%\dist\commitlore.mjs"
          copy /y "%shim%" "%root%-shim-before.cmd" >nul
          del "%bundle%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 %COMMITLORE_CI_VERSION% > "%root%-deleted.log" 2>&1
          set "code=%ERRORLEVEL%"
          type "%root%-deleted.log"
          if not "%code%"=="3" (
            echo ::error::expected exit 3 for a deleted bundle, got %code%
            exit /b 1
          )
          findstr /C:"%bundle%" "%root%-deleted.log" >nul || (
            echo ::error::the deleted bundle path was not named
            exit /b 1
          )
          fc /b "%root%-shim-before.cmd" "%shim%" >nul || (
            echo ::error::the shim changed after a deleted bundle was refused
            exit /b 1
          )
          findstr /C:"Remove-Item -LiteralPath" "%root%-deleted.log" >nul || (
            echo ::error::the damaged-checkout repair command was not named
            exit /b 1
          )
          powershell.exe -NoProfile -Command "$repair = (Get-Content -LiteralPath '%root%-deleted.log' | Where-Object { $_.TrimStart().StartsWith('Remove-Item -LiteralPath ') } | Select-Object -First 1).Trim(); if ([string]::IsNullOrEmpty($repair)) { throw 'repair command missing' }; Write-Host $repair; Invoke-Expression $repair"
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 %COMMITLORE_CI_VERSION% > "%root%-repaired.log" 2>&1
          if errorlevel 1 exit /b 1
          "%shim%" --version > "%root%-repaired-version.log" 2>&1
          if errorlevel 1 exit /b 1
          mkdir "%bundle%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 %COMMITLORE_CI_VERSION% > "%root%-directory.log" 2>&1
          set "code=%ERRORLEVEL%"
          type "%root%-directory.log"
          if not "%code%"=="3" (
            echo ::error::expected exit 3 for a bundle replaced by a directory, got %code%
            exit /b 1
          )
          findstr /C:"%bundle%" "%root%-directory.log" >nul || (
            echo ::error::the directory bundle path was not named
            exit /b 1
          )
          fc /b "%root%-shim-before.cmd" "%shim%" >nul || (
            echo ::error::the shim changed after a directory bundle was refused
            exit /b 1
          )

      # These two run under cmd, deliberately. A pwsh step on GitHub runs with
      # $ErrorActionPreference = 'Stop', which promotes a native command's stderr
      # to a terminating error -- so a step that captures the installer's own
      # error message with 2>&1 aborts on reading it and never reaches its
      # assertion. cmd has no error records: %ERRORLEVEL% is the exit code and
      # findstr reads the text. This is the same hazard the installer itself hit,
      # in the harness rather than the script.
      - name: A foreign file at the destination is refused with exit 4
        shell: cmd
        env:
          COMMITLORE_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          set "dir=%TEMP%\commitlore-occupied"
          mkdir "%dir%" 2>nul
          > "%dir%\commitlore.cmd" echo @echo not commitlore
          set "COMMITLORE_INSTALL_DIR=%dir%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 v9.9.9 > "%TEMP%\occupied.log" 2>&1
          set "code=%ERRORLEVEL%"
          set "COMMITLORE_INSTALL_DIR="
          type "%TEMP%\occupied.log"
          if not "%code%"=="4" (
            echo ::error::expected exit 4 for an occupied destination, got %code%
            exit /b 1
          )
          findstr /C:"refusing to overwrite it" "%TEMP%\occupied.log" >nul || (
            echo ::error::the refusal was not named
            exit /b 1
          )
          findstr /C:"not commitlore" "%dir%\commitlore.cmd" >nul || (
            echo ::error::the foreign file was modified
            exit /b 1
          )

      - name: An unknown tag is refused with exit 2 and installs nothing
        shell: cmd
        env:
          COMMITLORE_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 v0.0.0 > "%TEMP%\badtag.log" 2>&1
          set "code=%ERRORLEVEL%"
          type "%TEMP%\badtag.log"
          if not "%code%"=="2" (
            echo ::error::expected exit 2 for an unknown tag, got %code%
            exit /b 1
          )
          findstr /C:"git said:" "%TEMP%\badtag.log" >nul || (
            echo ::error::git's own reason was not quoted
            exit /b 1
          )
          if exist "%LOCALAPPDATA%\commitlore\v0.0.0" (
            echo ::error::a checkout was left behind
            exit /b 1
          )

      # What T-1121 owns is that the installer put a working CLI on this machine.
      # It deliberately does not require a healthy `doctor`: on Windows the
      # hook-runtime probe spawns /bin/sh, which does not exist there, and the
      # PreToolUse entry names `commitlore` while the shim is `commitlore.cmd`.
      # Both are real findings and both belong to T-1124, which owns the Windows
      # hook path and the support claim that depends on it. Asserting a green
      # doctor here would either fail this ticket for another ticket's work or
      # smuggle in a support claim this one is forbidden from making.
      - name: The installed tool works in a real repository
        shell: bash
        run: |
          set -uo pipefail
          shim="$LOCALAPPDATA\\commitlore\\bin\\commitlore.cmd"
          repo=$(mktemp -d)/repo
          mkdir -p "$repo"
          cd "$repo"
          git init -q -b main
          git config user.email t@example.com
          git config user.name "CommitLore CI"
          git config commit.gpgsign false
          printf 'export const value = 0;\n' > file.ts
          git add file.ts
          git commit -q -m "$(printf 'Seed\n\nLimit: the runner has no compiled artifact\nRecord-Id: r-ciwin0001\n')"

          # init reports; a check that needs attention is not this step's failure.
          "$shim" init || echo "(init reported steps needing attention -- see above)"

          echo "--- what init recorded ---"
          bin=$(git config --local --get commitlore.bin || true)
          node_path=$(git config --local --get commitlore.node || true)
          echo "commitlore.bin  = $bin"
          echo "commitlore.node = $node_path"
          case "$bin" in
            *dist/commitlore.mjs|*dist\\commitlore.mjs) ;;
            *) echo "::error::commitlore.bin is not the bundle: $bin"; exit 1 ;;
          esac
          test -n "$node_path" || { echo "::error::no interpreter was recorded"; exit 1; }

          echo "--- the CLI itself ---"
          "$shim" context file.ts || { echo "::error::context failed"; exit 1; }

          printf 'Bad\n\nBlast: wide\n' > /tmp/bad-message.txt
          if "$shim" validate --message-file /tmp/bad-message.txt; then
            echo "::error::an invalid record was accepted"
            exit 1
          fi
          printf 'Good\n\nLimit: a real condition\nRecord-Id: r-ciwin0002\n' > /tmp/good-message.txt
          "$shim" validate --message-file /tmp/good-message.txt || {
            echo "::error::a valid record was rejected"
            exit 1
          }

          echo "--- the Windows hook path, reported rather than asserted (T-1124) ---"
          "$shim" doctor || echo "(doctor reported problems -- T-1124 owns the Windows hook path)"

      # T-1124 (#283): #71's install-root containment, executed on Windows against
      # a wrapper install. A property verified on one platform is not a property of
      # the product, and macOS is the only place it has ever been executed.
      #
      # Paths are converted with `cygpath` rather than passed between the two path
      # worlds as-is. `init` records a win32 path (`C:\...`), the stub reads it
      # under Git for Windows' MSYS `sh`, and a witness file named `/tmp/ran.log`
      # by bash is `C:\tmp\ran.log` to node. A test that mixed the two forms would
      # report "the tampered program never ran" because it looked in the wrong
      # place -- the exact false pass this ticket cannot afford.
      - name: What the hook actually sees on Windows (measurement, not assertion)
        shell: bash
        run: |
          set -uo pipefail
          shim="$LOCALAPPDATA\\commitlore\\bin\\commitlore.cmd"
          repo=$(mktemp -d)/measure
          mkdir -p "$repo"
          cd "$repo"
          git init -q -b main
          git config user.email t@example.com
          git config user.name "CommitLore CI"
          git config commit.gpgsign false
          printf 'export const value = 0;\n' > file.ts
          git add file.ts
          git commit -q -m "$(printf 'Seed\n\nLimit: seeded before the hook exists\nRecord-Id: r-ciwin1124m\n')"
          "$shim" init || echo "(init reported steps needing attention)"

          echo "--- which sh will run the hook ---"
          git --version
          command -v sh || echo "(no sh on this PATH)"

          echo "--- what init recorded ---"
          recorded=$(git config --local --get commitlore.bin || true)
          recorded_root=$(git config --local --get commitlore.root || true)
          recorded_node=$(git config --local --get commitlore.node || true)
          echo "commitlore.bin  = $recorded"
          echo "commitlore.root = $recorded_root"
          echo "commitlore.node = $recorded_node"

          echo "--- what the installed hook itself contains, and what it resolves ---"
          # Not a recomputation. An earlier version of this step restated the
          # stub's comparison inline, and once the stub was fixed the restatement
          # kept printing the original defect next to a commit that had plainly
          # succeeded. A measurement that paraphrases what it measures reports on
          # the paraphrase.
          hook="$(git rev-parse --git-path hooks)/commit-msg"
          test -f "$hook" || { echo "::error::no commit-msg hook was installed"; exit 1; }
          echo "the hook's containment branch, as shipped:"
          sed -n '/recorded_root=/,/^fi$/p' "$hook" | sed 's/^/    /'
          recorded_slashed=$(printf %s "$recorded" | tr '\\' /)
          root_slashed=$(printf %s "$recorded_root" | tr '\\' /)
          echo "resolved: recorded parent = $(cd "${recorded_slashed%/*}" 2>/dev/null && pwd -P)"
          echo "resolved: recorded root   = $(cd "$root_slashed" 2>/dev/null && pwd -P)"
          echo "(the verdict is the real commit below, not a restatement here)"

          echo "--- where a fall-through lands ---"
          command -v commitlore >/dev/null 2>&1 \
            && echo "command -v commitlore: found -- $(command -v commitlore)" \
            || echo "command -v commitlore: NOT found (the shim is commitlore.cmd)"

          echo "--- what a commit-msg hook sees on this platform ---"
          # A scratch repository with a hook of its own, so this measures Git for
          # Windows rather than commitlore. The stub's chained-hook slot was tried
          # first and the probe there was never invoked, which is itself a reading:
          # the stub finds that slot with `hook_dir=${0%/*}`, and $0 with no `/`
          # in it leaves hook_dir as `.`.
          probe_repo=$(mktemp -d)/probe
          mkdir -p "$probe_repo"
          (
            cd "$probe_repo"
            git init -q -b main
            git config user.email t@example.com
            git config user.name "CommitLore CI"
            git config commit.gpgsign false
            {
              echo '#!/bin/sh'
              echo 'echo "hook argv0    = $0"'
              echo 'echo "hook PWD      = $PWD"'
              echo 'echo "hook pwd      = $(pwd)"'
              echo 'echo "hook pwd -P   = $(pwd -P)"'
              echo 'echo "hook uname    = $(uname -s 2>/dev/null || echo unknown)"'
              echo 'case "$0" in'
              echo '  */*) echo "hook dir-from-argv0 = ${0%/*}" ;;'
              echo '  *)   echo "hook argv0 holds no slash: a stub falls back to ." ;;'
              echo 'esac'
              echo 'exit 0'
            } > .git/hooks/commit-msg
            chmod +x .git/hooks/commit-msg
            printf 'x\n' > f.txt
            git add f.txt
            rc=0
            timeout -k 5 30 git commit -m "probe" > probe-out.txt 2>&1 || rc=$?
            echo "(probe commit exit $rc)"
            cat probe-out.txt 2>/dev/null || echo "(no probe output)"
          )

          echo "--- the walk, taken out of the installed hook and run from a drive root ---"
          # Sliced from the shipped stub, so a fix made only in a comment cannot
          # pass this. The seeded PWD is the form the probe above reports.
          awk '/^dir=\$PWD$/,/^done$/' "$hook" > "$RUNNER_TEMP/walk.sh"
          test -s "$RUNNER_TEMP/walk.sh" || { echo "::error::could not find the walk in the installed hook"; exit 1; }
          { echo 'PWD="C:/Users/RUNNER~1/AppData/Local/Temp/probe"'
            cat "$RUNNER_TEMP/walk.sh"
            echo 'echo "walk: returned"'
          } > "$RUNNER_TEMP/walk-run.sh"
          rc=0
          timeout -k 5 20 sh "$RUNNER_TEMP/walk-run.sh" || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::the walk did not return from a drive-letter root"
            exit 1
          fi

          echo "--- a real commit through the real hook, bounded ---"
          # Bounded on purpose. An unbounded hang is not evidence, it is a job
          # that dies at the runner's timeout with nothing printed.
          printf 'export const value = 1;\n' > file.ts
          git add file.ts
          # `|| rc=$?`, not a bare call: Actions runs a bash step as `bash -eo
          # pipefail`, and `set -uo pipefail` above does not clear the -e it was
          # invoked with. A bare timeout that fires would abort the step at that
          # line, which is how the first attempt lost its own verdict and the
          # probe output underneath it.
          rc=0
          timeout -k 5 90 git commit -m "$(printf 'Good\n\nLimit: a real condition\nRecord-Id: r-ciwin1124n\n')" \
            > "$(mktemp)" 2>&1 || rc=$?
          
          case "$rc" in
            0)   echo "real commit: ACCEPTED (exit 0)" ;;
            124) echo "real commit: HUNG -- killed at 90s, the hook never returned" ;;
            *)   echo "real commit: REFUSED (exit $rc)" ;;
          esac

          # The commit hung, so the hook certainly ran. What the stub did after
          # that is what the scratch-repo probe above reports.

      # The baseline runs before the attacks and is not decoration. An attack that
      # "passes" because nothing resolves at all is not containment -- it is a hook
      # that refuses everything, which fails the legitimate user too. The baseline
      # is the only thing that tells those two apart, so it asserts both
      # directions: a valid record is accepted, and an invalid one is refused.
      #
      # No continue-on-error, by the ticket's own terms.
      - name: The hook runs and discriminates through the recorded install (baseline)
        shell: bash
        run: |
          set -uo pipefail
          shim="$LOCALAPPDATA\\commitlore\\bin\\commitlore.cmd"
          repo=$(mktemp -d)/baseline
          mkdir -p "$repo"
          cd "$repo"
          git init -q -b main
          git config user.email t@example.com
          git config user.name "CommitLore CI"
          git config commit.gpgsign false
          printf 'export const value = 0;\n' > file.ts
          git add file.ts
          git commit -q -m "$(printf 'Seed\n\nLimit: seeded before the hook exists\nRecord-Id: r-ciwin1124s\n')"
          "$shim" init || echo "(init reported steps needing attention)"

          # grok-flagged: the stub prefers COMMITLORE_BIN over the recorded path,
          # so a value inherited from the environment would satisfy this step
          # without the recorded install ever being consulted.
          unset COMMITLORE_BIN
          hook_file="$(git rev-parse --git-path hooks)/commit-msg"
          test -z "$(git config --local --get core.hooksPath || true)" || {
            echo "::error::core.hooksPath is set; this step would measure another hook"; exit 1; }
          test -f "$hook_file" || { echo "::error::init installed no commit-msg hook"; exit 1; }
          grep -q 'commitlore:commit-msg:v1' "$hook_file" || {
            echo "::error::the installed commit-msg hook is not commitlore's"; exit 1; }

          # Every commit that passes through the hook is bounded. A hang is a
          # distinct outcome from a refusal and has to be reported as one; left
          # unbounded it becomes a job that dies at the runner timeout instead.
          # `|| c=$?` throughout: Actions runs a bash step as `bash -eo pipefail`,
          # and `set -uo pipefail` above does not clear that -e. A bare command
          # that times out would abort the step before it could report which of
          # the three outcomes -- accepted, refused, hung -- actually happened.
          out=$(mktemp)
          commit_bounded() {
            local c=0
            timeout -k 5 90 git commit -m "$1" > "$out" 2>&1 || c=$?
            sed -n '1,25p' "$out" || true
            return $c
          }

          # Acceptance first: this is the direction a dead hook fails. A hook that
          # exits non-zero unconditionally would satisfy the refusal case below
          # while blocking every commit on the platform.
          printf 'export const value = 1;\n' > file.ts
          git add file.ts
          rc=0
          commit_bounded "$(printf 'Good\n\nLimit: a real condition\nRecord-Id: r-ciwin1124a\n')" || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::the hook hung on a valid record and was killed at 90s"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::the hook refused a valid record through the recorded install (exit $rc)"
            exit 1
          fi

          # The refusal direction doubles as proof the hook ran at all: an
          # uninstalled or unreachable hook cannot reject anything, so a commit
          # that is accepted here means git never invoked it.
          printf 'export const value = 2;\n' > file.ts
          git add file.ts
          rc=0
          commit_bounded "$(printf 'Bad\n\nBlast: wide\n')" || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::the hook hung on an invalid record and was killed at 90s"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::error::the hook accepted an invalid record, so it never ran"
            exit 1
          fi
          echo "baseline ok: the hook runs, accepts a valid record and refuses an invalid one"

      - name: A recorded target outside the install root is refused (#71, attack 1)
        shell: bash
        run: |
          set -uo pipefail
          shim="$LOCALAPPDATA\\commitlore\\bin\\commitlore.cmd"
          repo=$(mktemp -d)/attack1
          mkdir -p "$repo"
          cd "$repo"
          git init -q -b main
          git config user.email t@example.com
          git config user.name "CommitLore CI"
          git config commit.gpgsign false
          printf 'export const value = 0;\n' > file.ts
          git add file.ts
          git commit -q -m "$(printf 'Seed\n\nLimit: seeded before the hook exists\nRecord-Id: r-ciwin1124t\n')"
          "$shim" init || echo "(init reported steps needing attention)"

          # grok-flagged: the stub prefers COMMITLORE_BIN over the recorded path,
          # so a value inherited from the environment would satisfy this step
          # without the recorded install ever being consulted.
          unset COMMITLORE_BIN
          hook_file="$(git rev-parse --git-path hooks)/commit-msg"
          test -z "$(git config --local --get core.hooksPath || true)" || {
            echo "::error::core.hooksPath is set; this step would measure another hook"; exit 1; }
          test -f "$hook_file" || { echo "::error::init installed no commit-msg hook"; exit 1; }
          grep -q 'commitlore:commit-msg:v1' "$hook_file" || {
            echo "::error::the installed commit-msg hook is not commitlore's"; exit 1; }

          outside=$(mktemp -d)
          witness="$outside/ran.log"
          # A .mjs, so it clears the extension allowlist: the only thing between it
          # and execution is the install-root check. ESM, because .mjs is ESM and a
          # `require` here would throw before writing the witness -- a false pass.
          # Forward slashes: node on Windows accepts them, and they need no escaping.
          printf 'import { appendFileSync } from "node:fs";\nappendFileSync("%s", "ran\\n");\nprocess.exit(0);\n' \
            "$(cygpath -m "$witness")" > "$outside/evil.mjs"
          # Positive control, before the attack: prove the witness mechanism can
          # fire at all. Without it "the witness is absent" is equally consistent
          # with a witness this harness could never have observed -- a path in the
          # wrong world, an ESM error, an unwritable directory.
          node "$outside/evil.mjs" || { echo "::error::the witness payload does not run"; exit 1; }
          test -f "$witness" || {
            echo "::error::the witness payload ran but wrote nothing this step can see"; exit 1; }
          rm -f "$witness"
          echo "positive control ok: the witness fires when the payload runs"

          # Recorded in win32 form, which is the form `init` itself writes.
          git config --local commitlore.bin "$(cygpath -w "$outside/evil.mjs")"

          printf 'export const value = 3;\n' > file.ts
          git add file.ts
          out=$(mktemp)
          rc=0
          timeout -k 5 90 git commit -m "$(printf 'Good\n\nLimit: a real condition\nRecord-Id: r-ciwin1124u\n')" \
            > "$out" 2>&1 || rc=$?
          # Printed, not swallowed: "the witness is absent" is only containment if
          # the hook actually ran and declined. The refusal text is what tells a
          # reader which of the two happened.
          echo "--- commit exit $rc, hook output ---"
          sed -n '1,25p' "$out" || true
          if [ "$rc" -eq 124 ]; then
            echo "::error::the hook hung on the tampered record and was killed at 90s"
            exit 1
          fi
          if [ -f "$witness" ]; then
            echo "::error::the recorded program outside the install root was executed"
            cat "$witness"
            exit 1
          fi
          echo "attack 1 refused: the program outside the install root never ran"

      - name: A recorded target that is not a script is refused (#71, attack 2)
        shell: bash
        run: |
          set -uo pipefail
          shim="$LOCALAPPDATA\\commitlore\\bin\\commitlore.cmd"
          repo=$(mktemp -d)/attack2
          mkdir -p "$repo"
          cd "$repo"
          git init -q -b main
          git config user.email t@example.com
          git config user.name "CommitLore CI"
          git config commit.gpgsign false
          printf 'export const value = 0;\n' > file.ts
          git add file.ts
          git commit -q -m "$(printf 'Seed\n\nLimit: seeded before the hook exists\nRecord-Id: r-ciwin1124v\n')"
          "$shim" init || echo "(init reported steps needing attention)"

          # grok-flagged: the stub prefers COMMITLORE_BIN over the recorded path,
          # so a value inherited from the environment would satisfy this step
          # without the recorded install ever being consulted.
          unset COMMITLORE_BIN
          hook_file="$(git rev-parse --git-path hooks)/commit-msg"
          test -z "$(git config --local --get core.hooksPath || true)" || {
            echo "::error::core.hooksPath is set; this step would measure another hook"; exit 1; }
          test -f "$hook_file" || { echo "::error::init installed no commit-msg hook"; exit 1; }
          grep -q 'commitlore:commit-msg:v1' "$hook_file" || {
            echo "::error::the installed commit-msg hook is not commitlore's"; exit 1; }

          root=$(git config --local --get commitlore.root || true)
          test -n "$root" || { echo "::error::no commitlore.root was recorded"; exit 1; }
          root_posix=$(cygpath -u "$root")
          witness=$(mktemp -d)/ran.log
          # Inside the install root, so the location check cannot be what refuses
          # it -- only the extension allowlist can.
          #
          # `.cmd`, not an extensionless name: the objection to the earlier payload
          # was that nothing in the stub could ever exec it, so refusing it tested
          # a branch that does not exist. `.cmd` is the extension a Windows fix is
          # most likely to add to the allowlist -- the installer's own shim carries
          # it -- which makes this a regression guard on a loosening somebody would
          # plausibly make. It is not evidence that containment holds; the
          # install-root check in attack 1 is.
          planted="$root_posix/commitlore.cmd"
          trap 'rm -f "$planted"' EXIT
          printf '@echo off\r\necho ran >> "%s"\r\n' "$(cygpath -w "$witness")" > "$planted"
          cmd //c "$(cygpath -w "$planted")" || true
          test -f "$witness" || {
            echo "::error::the planted payload ran but wrote nothing this step can see"; exit 1; }
          rm -f "$witness"
          echo "positive control ok: the planted .cmd fires when it is run"
          git config --local commitlore.bin "$(cygpath -w "$planted")"

          printf 'export const value = 4;\n' > file.ts
          git add file.ts
          out=$(mktemp)
          rc=0
          timeout -k 5 90 git commit -m "$(printf 'Good\n\nLimit: a real condition\nRecord-Id: r-ciwin1124w\n')" \
            > "$out" 2>&1 || rc=$?
          echo "--- commit exit $rc, hook output ---"
          sed -n '1,25p' "$out" || true
          if [ "$rc" -eq 124 ]; then
            echo "::error::the hook hung on the planted record and was killed at 90s"
            exit 1
          fi
          if [ -f "$witness" ]; then
            echo "::error::a recorded target with an unallowed extension was executed"
            exit 1
          fi
          echo "attack 2 refused: the unallowed-extension target never ran"
