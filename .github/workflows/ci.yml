name: CI

on:
  push:
    branches: [main, dev, 'release-*', 'hotfix-*']
  pull_request:

# The conformance suite and the dogfooding gate are the two things that make
# this repository's claims checkable. Neither is optional, and neither is
# allowed to pass by being skipped.
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor this package promises (ADR-0010) and the current Active LTS.
        # Running only the floor misses breakage on newer runtimes; running only
        # the newest makes the floor a claim nobody checks.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # test/dogfood.test.ts validates this repository's own commit history.
          # A shallow clone would truncate it, and the suite is written to fail
          # loudly rather than silently check nothing -- but there is no reason
          # to make it do that on every run.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # npm reports EBADENGINE as a warning and installs anyway, so a dependency
      # that breaks the supported floor lands silently and surfaces later as
      # something unrelated -- here, as test workers dying with no explanation.
      - name: Dependencies support the supported Node floor
        run: node scripts/check-engines.mjs

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck bench
        run: npx tsc -p bench/tsconfig.json --noEmit

      - name: Build
        run: npm run build

      # dist/ is committed because that is what makes this repository
      # installable as a plugin with no registry (ADR-0011). A committed build
      # that drifts from src/ ships stale code to every user, and the drift is
      # invisible -- nothing fails, the wrong thing just runs. The build is
      # deterministic, so rebuilding and diffing is a complete check.
      - name: Committed dist/ matches src/
        run: |
          git diff --exit-code -- dist/ || {
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            exit 1
          }

      - name: Unit and dogfooding tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json

      # A worker that dies removes its file from the report without failing the
      # run, so a green summary can be hiding an untested module. Compare the
      # files on disk to the files in the report.
      - name: Every test file actually ran
        run: node scripts/check-test-files-ran.mjs vitest-report.json

      # Fixture conformance, README example sync, and the README vocabulary
      # table vs SPEC section 3. Documentation claims that can be checked by
      # machine are checked by machine.
      - name: Conformance suite
        run: bash spec/verify.sh

      # PRD-F2 AC 2 claims a path-scoped query stays under 100ms on a
      # 100k-commit repository. The default suite runs this file against 2k
      # commits, so without this step the acceptance criterion is asserted and
      # never measured. Measured locally at p50 1.86ms -- 54x under the
      # threshold -- so a CI runner would have to be fifty times slower before
      # this went marginal, which is what makes it safe to gate on rather than
      # merely report.
      - name: PRD-F2 100k-commit query performance
        env:
          COMMITLORE_PERF_LARGE: "1"
        run: npx vitest run test/index-perf.test.ts --reporter=basic

      # Every measured figure in the README is regenerated from bench/results/
      # through bench/report.ts and compared byte for byte, and a short list of
      # statistics is refused outside the generated block. A rate somebody typed,
      # or one generated honestly and then left behind when the matrix grew,
      # fails here. This ran without --write on purpose: CI checks, it never
      # rewrites, so a branch that skipped the regeneration still fails.
      - name: README measured numbers are regenerable
        run: node scripts/check-readme-numbers.mjs

      # test/dogfood.test.ts exercises the library. This exercises the binary a
      # user actually installs, against this repository's own history, which is
      # the only way the packaged entry point, its schema lookup from dist/, and
      # the range walk get covered together.
      #
      # The range is derived rather than pinned -- a hardcoded cutoff goes stale
      # and a stale cutoff reads as passing, which is the same rule the library
      # path follows.
      - name: The CLI validates this repository's own history
        run: node dist/cli.js validate --range "$(node scripts/adoption-range.mjs)"

      - name: doctor runs clean enough to report
        run: node dist/cli.js doctor

      # Test what is actually shipped. Distribution is a git clone (ADR-0011),
      # so the failure this has to catch is a clone that does not run: dist/
      # missing a file, a path resolved against the source tree rather than the
      # install, or a plugin entry point that is not executable. Cloning into a
      # different directory is the whole test — if it works there, it works for
      # a user.
      - name: A fresh clone runs, and the plugin entry points resolve
        run: |
          set -euo pipefail
          clone_dir="$(mktemp -d)/commitlore"
          git clone --quiet --depth 1 "file://$PWD" "$clone_dir"
          test -f "$clone_dir/dist/commitlore.mjs" || { echo "the bundle is not in the clone"; exit 1; }
          # No node_modules anywhere near it: the bundle carries its dependencies,
          # which is the whole claim ADR-0011 makes and #38 closed.
          test ! -d "$clone_dir/node_modules" || { echo "clone is contaminated with node_modules"; exit 1; }
          node "$clone_dir/dist/commitlore.mjs" --version
          # Reads spec/schema/record.schema.json through the package root walk in
          # core/paths.ts, so this fails if the clone stops carrying spec/ or if
          # a bundled module goes back to guessing its own depth.
          printf 'Subject\n\nBlast: wide\n' | node "$clone_dir/dist/commitlore.mjs" validate && {
            echo "expected a violation to exit non-zero"; exit 1;
          } || test $? -eq 1
          node "$clone_dir/dist/commitlore.mjs" doctor
          # #64: `doctor` recommends this exact command as its fix for a
          # missing index, so it must actually work with no node_modules —
          # this is what a `better-sqlite3` dependency broke silently, because
          # nothing above this line ever built the index in a clean clone.
          node "$clone_dir/dist/commitlore.mjs" index --rebuild
          # And the query commands must actually use what was just built, not
          # silently fall back to scanning git (ADR-0012). `index --json`
          # rather than `context --json`: this clone's default `origin`
          # refspec does not cover `refs/notes/commitlore`, so `context`
          # correctly exits 3 for "notes unfetched" here regardless of the
          # index, which is not what this step checks.
          node "$clone_dir/dist/commitlore.mjs" index --json | node -e '
            let s = "";
            process.stdin.on("data", (d) => { s += d; });
            process.stdin.on("end", () => {
              const out = JSON.parse(s);
              if (out.index?.lastIndexedSha == null || out.rebuilt !== false) {
                console.error("index --json did not report a current, already-built index:", out);
                process.exit(1);
              }
            });
          '
          # The plugin resolves its entry point through this script, with
          # CLAUDE_PLUGIN_ROOT pointing at the clone.
          test -x "$clone_dir/scripts/commitlore-run.sh" || { echo "run script not executable"; exit 1; }
          CLAUDE_PLUGIN_ROOT="$clone_dir" "$clone_dir/scripts/commitlore-run.sh" --version
          # Every plugin manifest must parse, or the plugin silently does nothing.
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json hooks/hooks.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$clone_dir/$f"
          done

  # git's own behavior is the substrate this protocol delegates to, so a git
  # version that parses trailers differently is a correctness problem, not a
  # compatibility footnote. SPEC section 2.1 was derived empirically from one
  # build; this job is where that assumption gets tested against others.
  git-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report git version
        run: git --version
      - name: Conformance suite
        run: bash spec/verify.sh

  # #99: install.sh (the README's second, non-canonical install path — curl the
  # script, pipe it to sh) had never run on a machine that was not the
  # author's. `check`'s fresh-clone step and `binary` above both prove
  # something real, but neither touches install.sh at all — they build
  # dist/commitlore.mjs or dist/commitlore directly from this checkout and run
  # it there. install.sh's own job is different: download a release asset,
  # verify its checksum *before* installing anything, and detect which of six
  # coding agents are on the machine — none of that is exercised anywhere
  # else.
  #
  # This runs it inside containers that start with **nothing preinstalled** —
  # no curl/jq/tar/git added ahead of time to make it pass — on two images
  # chosen for what each one actually is, not for convenience:
  #   - debian:stable-slim: glibc, bash present, but neither curl nor wget
  #     ships by default. Whatever install.sh does about that is what a real
  #     "minimal tooling" machine hits.
  #   - alpine:latest: busybox sh, not bash. install.sh's shebang is
  #     `#!/bin/sh`; this is the actual portability test, and #99 found a real
  #     failure here (see the "musl" step below) — that failure is the point
  #     of running this image, not a flake to work around.
  #
  # ubuntu-latest is not in this matrix on purpose: `binary` above already
  # proves the compiled binary itself works on a real (non-containerized)
  # Linux and macOS host with no Node on PATH. Adding it here would test the
  # same binary a second time through a thicker layer, not a new claim.
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # install.sh no longer downloads a release asset (ADR-0026), so there is
      # no staged tarball, no checksum file and no corrupted copy to reject. What
      # it does instead is clone a pinned tag and write a thin wrapper, so the
      # source under test is a local repository with a tag on it. Nothing here
      # reaches github.com, and nothing here builds a binary.
      # The checkout itself is the source. An earlier revision cloned it to a
      # separate directory and bind-mounted that read-only into the containers,
      # which made git report only "correct access rights and the repository
      # exists" -- a mount and ownership problem standing in for the thing under
      # test. One repository, mounted read-write where the container already
      # mounts it, removes that whole class of noise.
      - name: Tag the checkout so install.sh has a pinned version to clone
        run: |
          set -euo pipefail
          git -c user.name=ci -c user.email=ci@example.invalid tag -f v9.9.9
          git tag --list v9.9.9

      - name: Fresh install, then upgrade over it
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          export COMMITLORE_INSTALL_SOURCE="$GITHUB_WORKSPACE"

          sh install.sh v9.9.9
          wrapper="$HOME/.local/bin/commitlore"
          test -x "$wrapper"
          grep -qF '# commitlore:wrapper:v1' "$wrapper"
          test -f "$HOME/.local/share/commitlore/v9.9.9/dist/commitlore.mjs"
          "$wrapper" --version

          # The wrapper is replaced by rename, and a second run is an upgrade
          # rather than a refusal. An in-place overwrite of a file that may be
          # executing is the defect that forced a same-day patch release.
          sh install.sh v9.9.9
          "$wrapper" --version

          # No shell profile is written. Printing the PATH line is the whole of
          # what this script does about PATH.
          for rc in .bashrc .zshrc .profile .bash_profile; do
            test ! -e "$HOME/$rc" || { echo "::error::install.sh wrote $rc"; exit 1; }
          done

      - name: The script carries no asset, checksum or target triple
        run: |
          set -euo pipefail
          for forbidden in SHA256SUMS '.tar.gz' 'tar -xzf' unknown-linux-gnu apple-darwin; do
            if grep -qF "$forbidden" install.sh; then
              echo "::error::install.sh still mentions $forbidden"
              exit 1
            fi
          done

      # A bare image is the point: the prerequisites are genuinely absent, so
      # the named failure is the thing being asserted rather than routed around.
      # Adding them afterwards is the same progression the previous version of
      # this job used for curl -- assert the clean failure first, then the
      # success once the requirement is satisfied.
      - name: Bare debian names the missing prerequisite and installs nothing
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w debian:stable-slim sh -c '
            set -eu
            out=$(COMMITLORE_INSTALL_SOURCE=/w sh install.sh v9.9.9 2>&1 || true)
            printf "%s\n" "$out"
            printf "%s" "$out" | grep -qi "node" || { echo "expected the message to name Node"; exit 1; }
            test ! -e "$HOME/.local/bin/commitlore" || { echo "something was installed"; exit 1; }
          '

      - name: The same image succeeds once Node and Git are present
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w node:22-bookworm-slim sh -c '
            set -eu
            apt-get update -qq && apt-get install -y -qq git >/dev/null
            # The checkout is owned by the runner uid, not this container user.
            git config --global --add safe.directory /w
            git config --global --add safe.directory "*"
            # Raw clone first, unfiltered: if the installer cannot fetch, this
            # shows git saying why instead of leaving it to be inferred.
            echo "--- raw clone probe ---"
            git clone --depth 1 --branch v9.9.9 /w /tmp/probe || echo "(probe failed, see above)"
            echo "--- installer ---"
            COMMITLORE_INSTALL_SOURCE=/w sh install.sh v9.9.9
            "$HOME/.local/bin/commitlore" --version
          '

  # T-1121 (#282): install.ps1 is install.sh's twin, and a shape test cannot show
  # that a PowerShell script runs. This job is the evidence -- a real
  # windows-latest runner, the script executed the way a user would execute it,
  # and the tool it installs used afterwards.
  #
  # The source is this checkout with a local tag, exactly as the install-script
  # job does for the shell installer: nothing here reaches github.com, so the job
  # tests the script rather than the network.
  #
  # Both hosts are exercised, and each one does real work rather than repeating
  # the other: Windows PowerShell 5.1 performs the first install, PowerShell 7
  # performs the upgrade. 5.1 matters because it is what a Windows machine has
  # before anyone installs anything, and a 7-only construct fails to parse the
  # whole file rather than one branch of it.
  #
  # The hosts are named literally. `shell:` accepts no expression -- a
  # `${{ matrix.shell }}` there makes the workflow unloadable, which is how this
  # job was first written and how it first failed (actions/runner#444).
  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag this checkout so the installer has a pinned source
        shell: bash
        run: |
          set -euo pipefail
          git config user.email t@example.com
          git config user.name "CommitLore CI"
          git tag v9.9.9

      # -File, under 5.1, with the version as a positional argument: the same
      # entry point a user gets from `& ([scriptblock]::Create((irm ...))) v9.9.9`,
      # and the one that proves param() binds.
      - name: Install under Windows PowerShell 5.1
        shell: cmd
        env:
          COMMITLORE_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 v9.9.9
          if errorlevel 1 exit /b 1

      - name: The 5.1 host reports its own version, for the record
        shell: cmd
        run: powershell.exe -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: The shim exists, is CRLF, and reports the declared version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shim = Join-Path $env:LOCALAPPDATA 'commitlore\bin\commitlore.cmd'
          if (-not (Test-Path -LiteralPath $shim)) { throw "no shim at $shim" }
          $body = Get-Content -LiteralPath $shim -Raw
          if ($body -notmatch 'commitlore:wrapper:v1') { throw 'the shim carries no marker' }
          if ($body -notmatch "`r`n") { throw 'the shim is not CRLF' }
          $version = (& $shim --version | Select-Object -First 1)
          Write-Host "shim reports: $version"
          $declared = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version.Trim() -ne $declared) { throw "shim reports $version, package.json declares $declared" }
          & $shim --help > $null
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

      # The documented piped form, under PowerShell 7. `iex` gives a piped script
      # no arguments, so the version arrives through COMMITLORE_VERSION -- which is
      # why that variable exists. This step is also the only check that a leading
      # param() block survives Invoke-Expression at all.
      - name: A second install through the documented pipe is an upgrade
        shell: pwsh
        env:
          COMMITLORE_INSTALL_SOURCE: ${{ github.workspace }}
          COMMITLORE_VERSION: v9.9.9
        run: |
          $ErrorActionPreference = 'Stop'
          $out = (Get-Content -LiteralPath .\install.ps1 -Raw | Invoke-Expression 2>&1 | Out-String)
          Write-Host $out
          if ($out -notmatch 'reusing the existing checkout') { throw 'the checkout was not reused' }
          if ($out -notmatch 'upgrading the existing commitlore shim') { throw 'the shim was not recognized as its own' }

      - name: A foreign file at the destination is refused with exit 4
        shell: pwsh
        env:
          COMMITLORE_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          $dir = Join-Path $env:TEMP 'commitlore-occupied'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -LiteralPath (Join-Path $dir 'commitlore.cmd') -Value '@echo not commitlore'
          $env:COMMITLORE_INSTALL_DIR = $dir
          $out = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 v9.9.9 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Remove-Item Env:\COMMITLORE_INSTALL_DIR
          Write-Host $out
          if ($code -ne 4) { throw "expected exit 4 for an occupied destination, got $code" }
          if ($out -notmatch 'refusing to overwrite it') { throw 'the refusal was not named' }
          $body = Get-Content -LiteralPath (Join-Path $dir 'commitlore.cmd') -Raw
          if ($body -notmatch 'not commitlore') { throw 'the foreign file was modified' }

      - name: An unknown tag is refused with exit 2 and installs nothing
        shell: pwsh
        env:
          COMMITLORE_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          $out = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 v0.0.0 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 2) { throw "expected exit 2 for an unknown tag, got $code" }
          if ($out -notmatch 'git said:') { throw "git's own reason was not quoted" }
          if (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'commitlore\v0.0.0')) { throw 'a checkout was left behind' }

      # The hook is the point. Windows support is not claimed by this job (T-1124
      # owns that), but what the installer puts on the machine has to work.
      - name: The installed tool works in a real repository
        shell: bash
        run: |
          set -euo pipefail
          shim="$LOCALAPPDATA\\commitlore\\bin\\commitlore.cmd"
          repo=$(mktemp -d)/repo
          mkdir -p "$repo"
          cd "$repo"
          git init -q -b main
          git config user.email t@example.com
          git config user.name "CommitLore CI"
          git config commit.gpgsign false
          printf 'export const value = 0;\n' > file.ts
          git add file.ts
          git commit -q -m "$(printf 'Seed\n\nRecord-Id: r-ciwin0001\nBlast: local\nUndo: easy\nCertainty: firm\n')"

          "$shim" init
          echo "--- recorded ---"
          git config --local --get commitlore.bin
          git config --local --get commitlore.node
          "$shim" doctor || echo "(doctor reported problems -- see above)"

          printf 'export const value = 1;\n' > file.ts
          git add file.ts
          if git commit -q -m "$(printf 'Bad\n\nBlast: wide\n')"; then
            echo "::error::an invalid record was accepted by the hook"
            exit 1
          fi
          git commit -q -m "$(printf 'Good\n\nLimit: the runner has no compiled artifact\nRecord-Id: r-ciwin0002\n')"
          "$shim" context file.ts
