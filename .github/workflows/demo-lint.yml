name: Demo — PR lint

# This repository runs its own PR lint action on its own pull requests, with
# the build from the pull request rather than the last release. An action whose
# only proof is a demo repository is an action nobody has run in anger; this is
# the same gate that CI applies to the CLI (`.github/workflows/ci.yml`), moved
# one layer out to the thing users install.
#
# Separate from ci.yml on purpose: this job needs `pull-requests: write` and
# only runs on pull requests, and CI must not inherit either.
on:
  pull_request:
  push:
    branches: [dev]

permissions:
  # The action asks for nothing beyond the comment; the read is the checkout's.
  contents: read
  pull-requests: write

jobs:
  lint:
    # The action's own range derivation works for PRs. On push events there is
    # no base_ref, so this job only runs for pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action refuses a shallow clone rather than lint whatever
          # subset of history the default depth happened to bring.
          fetch-depth: 0

      # actions/checkout does not bring git notes, and a record that survived a
      # squash lives in the mirror (ADR-0004). The action stops if origin has
      # the ref and the checkout does not, so fetching it here is what keeps
      # this workflow from being the thing that fails.
      - name: Bring the record notes mirror, if there is one
        run: |
          if git ls-remote --exit-code origin refs/notes/commitlore >/dev/null 2>&1; then
            git fetch --no-tags origin '+refs/notes/commitlore:refs/notes/commitlore'
          else
            echo "origin carries no refs/notes/commitlore yet -- nothing to mirror"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - run: npm ci

      # cli-path below points at this; without it the lint would be running the
      # published package against a pull request that may be changing it.
      - run: npm run build

      - uses: ./action/lint
        with:
          cli-path: dist/cli.js

  # #186: a feature-branch PR lints only its own commits. Two commits that
  # duplicate a Record-Id appear together only in the full origin/main..dev
  # range — which nothing checked until a promotion PR. This job closes that
  # gap: every push to dev lints the entire promotion range, so a collision
  # that a narrow PR range hid is caught the moment it lands.
  promotion-range-lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bring the record notes mirror, if there is one
        run: |
          if git ls-remote --exit-code origin refs/notes/commitlore >/dev/null 2>&1; then
            git fetch --no-tags origin '+refs/notes/commitlore:refs/notes/commitlore'
          else
            echo "origin carries no refs/notes/commitlore yet -- nothing to mirror"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Lint the full promotion range (origin/main..HEAD)
        run: node dist/commitlore.mjs validate --range origin/main..HEAD
