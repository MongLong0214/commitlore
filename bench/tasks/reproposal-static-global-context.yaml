id: reproposal-static-global-context
description: >-
  CommitLore's own ADR-0006 decision. A static repository-wide context file was
  rejected in favour of dynamic path-scoped injection. The agent is asked to cut
  per-read hook overhead, the request that usually produces "precompute one file
  and load it once".
repo:
  kind: synthetic
  seed_commits:
    - files:
        "src/core/inject.ts": |
          import { project } from "./project.ts";
          import { recordsForPath } from "./query.ts";

          export const injectForPath = (repo: string, filePath: string): string | null => {
            const records = recordsForPath(repo, filePath);
            if (records.length === 0) return null;
            return project(records);
          };
        "src/core/query.ts": |
          import type { Record } from "./project.ts";

          export const recordsForPath = (repo: string, filePath: string): readonly Record[] => {
            void repo;
            void filePath;
            return [];
          };
        "src/hooks/pre-tool-use.ts": |
          import { injectForPath } from "../core/inject.ts";

          export const onPreToolUse = (repo: string, filePath: string): string | null =>
            injectForPath(repo, filePath);
      message: |
        Inject only the records that cover the path being read

        The hook resolves the records for one path at the moment the agent touches
        it, so what arrives is scoped to the file in hand.

        Limit: the injected block is scoped to the path under the tool call — a
          whole-repository dump is what the scoping exists to prevent
        Ruled-out: a checked-in repository-wide context file the agent loads once |
          it goes stale the moment the code moves and there is no path signal left
          to decide what is relevant, which measured worse than no context at all
        Ruled-out: concatenating every record into one preamble at session start |
          the same loss of scope, paid on every session instead of every read
        Warn: the hook runs on the user's critical path — a slow hook will be
          switched off, and a switched-off hook records nothing
        Blast: system
        Undo: easy
        Certainty: firm
        Record-Id: r-1a77e5
        Provenance: authored
        CommitLore-Version: 2.0.0
prompt: |
  Half the team uses editors and agents that have no pre-tool-use hook — there is
  no interception point to call `onPreToolUse` from, and no plugin API to add
  one. `injectForPath` is therefore never invoked for them, and those people get
  no records at all, ever.

  We cannot ship hooks for every tool on the market. Get the records in front of
  those users, implement your approach, and explain the one you chose.
# DISCRIMINATIVE PROPERTY (see bench/README.md): the symptom crosses the tool
# boundary. Users on editors with no interception point cannot be reached by
# caching, memoising or speeding up a hook that is never called — writing one
# file every tool already reads is the natural answer, and it is the ruled-out
# one. The pilot's symptom ("the hook costs 200ms per read") was fixed by the
# control arm by memoising per path.
#
# Reference correct solution: an explicit command any editor can run, still
# resolved per path and per invocation, so nothing goes stale and nothing is
# dumped repo-wide. That diff creates no repository-root markdown file and no
# agent-config directory. Verified mechanically.
#
# The matchers key on the *creation of the file* (`^diff --git a/CLAUDE.md`)
# rather than on the filename appearing in text, for the reason given in
# bench/README.md, "Detection surfaces": naming a rejected option is not
# proposing it, and a filename is unusually easy to name while declining it.
detect:
  reproposed_if:
    any_of:
      - kind: regex
        value: "^diff --git a/(?:CLAUDE|AGENTS|GEMINI|CONVENTIONS)\\.md"
        flags: "im"
        in: artifacts
        label: regex:global-context-file-added
      - kind: regex
        value: "writeFileSync\\([^)]*(?:CLAUDE|AGENTS|GEMINI)\\.md|\\.cursorrules"
        in: artifacts
        label: regex:global-context-file-written
      - kind: regex
        value: "^diff --git a/\\.claude/|^diff --git a/\\.github/copilot-instructions"
        flags: "im"
        in: artifacts
        label: regex:agent-config-file-added
  # No violation clause. The Limit here is path scoping, and the pilot showed it
  # is not expressible as a regex over a diff.
  #
  # The previous attempt matched `allRecords(`, `recordsForRepo(` and friends. It
  # fired on a correct solution that loaded records into a cache and then did
  # `allRecords.filter(r => r.path === filePath)` on the very next line — still
  # perfectly path-scoped. The clause was keying on a **function name**, which is
  # the author's free choice rather than a semantic signature, and that is the
  # identical mistake `createLogger(` was rejected for in reproposal-winston-logger.
  #
  # Loading records and injecting records are different acts, and only the second
  # one is constrained. A regex over a diff cannot tell them apart, so no
  # violation is defined rather than one that punishes correct code.
budget:
  turns: 24
  tokens: 60000
