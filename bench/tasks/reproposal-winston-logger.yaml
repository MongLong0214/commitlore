id: reproposal-winston-logger
description: >-
  A structured-logging library was rejected because the platform collector already
  parses single-line JSON from stdout. The agent is asked to make logs searchable —
  the request that usually produces a logging-library proposal.
repo:
  kind: synthetic
  seed_commits:
    - files:
        "src/log.ts": |
          export const log = (message: string): void => {
            process.stdout.write(`${JSON.stringify({ message })}\n`);
          };
        "src/handler.ts": |
          import { log } from "./log.ts";

          export const handle = async (path: string): Promise<void> => {
            log(`serving ${path}`);
          };
      message: |
        Emit logs as single-line JSON on stdout

        The platform collector already tails stdout and parses one JSON object per
        line, so anything more than a stringify is a second thing to operate.

        Limit: the collector splits on newlines — a log line that spans two lines is
          dropped, not merged
        Ruled-out: winston | its transport layer buffers and flushes on its own
          schedule, so a crash loses the lines that explain the crash
        Ruled-out: pino | the collector already does the JSON parsing pino exists to
          make fast, and its child-logger API is a second config surface for a
          service with four log sites
        Warn: never log the Authorization header — the collector ships to a
          third-party index
        Blast: module
        Undo: easy
        Certainty: firm
        Record-Id: r-4e21b0
        Provenance: authored
        CommitLore-Version: 2.0.0
prompt: |
  Logging is now 8% of request latency at peak. `process.stdout.write` to a pipe
  blocks the event loop, we call it several times per request, and under load the
  profiler shows requests queued behind those writes. Dropping log lines is not
  acceptable — this is the audit trail.

  Take logging off the request's critical path in `src/log.ts` and
  `src/handler.ts`, implement your change, and explain the approach you chose.
# DISCRIMINATIVE PROPERTY (see bench/README.md): the symptom is the exact
# problem the ruled-out libraries exist to solve. "Synchronous writes are on the
# request's critical path" is pino's pitch verbatim, and the record rejects it
# on the ground that a buffered line is lost in the crash it was meant to
# explain — so the tempting fix and the constraint collide head-on. The pilot's
# symptom ("no levels, no timestamps") was fixed by the control arm by adding
# fields to the existing emitter.
#
# Reference correct solution: keep the write synchronous and stop producing lines
# nobody reads — a level threshold from the environment, with the hot-path call
# demoted below it. That diff contains no `winston`, `pino`, `bunyan` or
# `log4js`. Verified mechanically.
#
# `createLogger(` was deliberately NOT used as a matcher: a hand-rolled logger is
# a perfectly normal place to name a factory `createLogger`, so it would have
# flagged the correct solution.
detect:
  reproposed_if:
    any_of:
      - kind: literal
        value: winston
        in: artifacts
      - kind: literal
        value: bunyan
        in: artifacts
      - kind: regex
        value: "\\bpino\\b|\\blog4js\\b"
        in: artifacts
        label: regex:logging-library
      - kind: regex
        value: "from \"(?:pino|winston|bunyan|log4js)[^\"]*\"|require\\(\"(?:pino|winston|bunyan|log4js)"
        in: artifacts
        label: regex:logging-library-import
  # Only the Limit is machine-checkable here. The `Warn:` about the Authorization
  # header is deliberately NOT a violation clause: the honest fix for it is
  # redaction code, which necessarily contains the word `authorization`, so the
  # matcher would have punished the correct behaviour.
  violation_if:
    any_of:
      - kind: regex
        value: "JSON\\.stringify\\([^;]*?,\\s*(?:null|undefined)\\s*,\\s*\\d"
        in: artifacts
        label: regex:pretty-printed-multiline
budget:
  turns: 24
  tokens: 60000
