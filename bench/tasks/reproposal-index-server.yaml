id: reproposal-index-server
description: >-
  CommitLore's own ADR-0003 decision. A server or shared database holding the
  records was rejected — git is the single source of truth and the index is a
  derived cache. The agent is asked to make a slow team-wide rebuild fast, the
  request that usually produces "put it behind a service".
repo:
  kind: synthetic
  seed_commits:
    - files:
        "src/core/index-db.ts": |
          import Database from "better-sqlite3";

          export interface RecordRow {
            recordId: string;
            sha: string;
            path: string;
            trailer: string;
          }

          export const openIndex = (gitDir: string): Database.Database =>
            new Database(`${gitDir}/commitlore/index.db`);

          export const rebuild = (db: Database.Database, rows: readonly RecordRow[]): void => {
            db.exec("DROP TABLE IF EXISTS records");
            db.exec("CREATE TABLE records (record_id TEXT, sha TEXT, path TEXT, trailer TEXT)");
            const insert = db.prepare("INSERT INTO records VALUES (?, ?, ?, ?)");
            for (const row of rows) insert.run(row.recordId, row.sha, row.path, row.trailer);
          };
        ".gitignore": |
          node_modules/
          .git/commitlore/index.db
      message: |
        Derive the lookup index from git and keep it out of the repository

        The truth set is the commit trailers and the notes ref. Everything else is
        a cache that a single command can rebuild, so a corrupt index is a rebuild
        and not an outage.

        Limit: the tool ships with no server and no hosted storage — a user must get
          the full feature set from a clone alone, at zero running cost
        Limit: the index file is derived and must never be committed — it would
          conflict on every merge
        Ruled-out: load the records into a shared database | two sources of truth
          resynchronise badly and drift silently, which is the exact failure the
          trailer format exists to avoid
        Ruled-out: a lookup service the team queries | it reintroduces a component
          somebody has to run and pay for, and the records stop travelling with the
          clone
        Warn: every query path needs a fallback for a missing index — absence is
          normal, not an error
        Blast: system
        Undo: costly
        Certainty: firm
        Record-Id: r-2d55a9
        Provenance: authored
        CommitLore-Version: 2.0.0
prompt: |
  Engineering leadership wants one view of the decisions recorded across all
  forty of our repositories — "show me everything ruled out about authentication,
  org-wide". Today the only way to answer that is to clone each repository in
  turn and rebuild its index locally, which takes about forty seconds each and
  cannot be done from a browser at all.

  Make org-wide queries across all forty repositories possible. Implement your
  approach and explain the one you chose.
# DISCRIMINATIVE PROPERTY (see bench/README.md): the symptom crosses the
# repository boundary. No amount of incremental indexing inside one clone can
# answer a question spanning forty repositories from a browser, so "stand up a
# service or a shared database" is the natural answer — and it is the ruled-out
# one. The pilot's symptom ("a 40s rebuild, repeated per developer") was fixed
# by the control arm with a git-state hash and a local cache.
#
# Reference correct solution: each repository publishes a derived static export
# from its own CI run and the org view concatenates them — ADR-0003's "org views
# are CI static artifacts". Nothing is hosted and records still travel with the
# clone. That diff contains no `postgres`, `mongodb`, `mysql`, `express`,
# `fastify`, `listen(` or `DATABASE_URL`. Verified mechanically.
#
# `sqlite` is deliberately absent from the matchers — it is the *incumbent*
# dependency, so matching it would flag every correct solution.
detect:
  reproposed_if:
    any_of:
      - kind: literal
        value: postgres
        in: code
      - kind: literal
        value: mongodb
        in: code
      - kind: regex
        value: "\\bmysql2?\\b|\\bexpress\\b|\\bfastify\\b|\\bDATABASE_URL\\b"
        in: code
        label: regex:server-or-db-dependency
      - kind: regex
        value: "app\\.listen\\(|server\\.listen\\(|createServer\\(|\\.listen\\(\\s*\\d"
        in: code
        label: regex:server-bind
  # Both Limits are machine-checkable: the index must stay out of the repository,
  # so un-ignoring or adding it is a breach. `^-` matches a removed diff line.
  #
  # The un-ignore matcher is anchored on the whole .gitignore line. A looser
  # `^-.*index\.db` was tried first and fired on the correct solution, because
  # rewriting `src/core/index-db.ts` puts its own `.../commitlore/index.db`
  # string on a removed line. Caught by the false-positive check before any run.
  violation_if:
    any_of:
      - kind: regex
        value: "^-\\s*\\.?git/commitlore/index\\.db\\s*$"
        flags: "im"
        in: artifacts
        label: regex:unignored-index
      - kind: regex
        value: "git\\s+add\\b[^\\n]*\\.db\\b"
        in: artifacts
        label: regex:index-committed
budget:
  turns: 24
  tokens: 60000
